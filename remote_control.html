<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meus Recortes - Câmera Fullscreen & Controle 🎬</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0f17;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* HEADER FIXO TOPO */
        header {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            text-align: center;
            pointer-events: none;
        }

        .logo-badge {
            background: rgba(13, 15, 23, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #a0a5c0;
            display: inline-block;
            text-transform: uppercase;
        }

        /* TABS DE MODO */
        .mode-tabs {
            position: fixed;
            top: 48px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            gap: 6px;
            width: 92%;
            max-width: 440px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(13, 15, 23, 0.85);
            backdrop-filter: blur(12px);
            color: #a0a5c0;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            color: #fff;
            border-color: #ff4444;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.4);
        }

        /* MODO CÂMERA FULLSCREEN (TELA CHEIA) */
        .fullscreen-cam-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        video#webCamPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* PAINEL FLUTUANTE DE CONFIGURAÇÃO DE TEMPO NA CÂMERA */
        .cam-time-config {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(13, 15, 23, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .time-box label {
            font-size: 9px;
            font-weight: 800;
            color: #a0a5c0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time-box select {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            outline: none;
        }

        /* CONTROLES FLUTUANTES NO RODAPÉ DA CÂMERA */
        .cam-overlay-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 90%;
            max-width: 380px;
        }

        .btn-cam-control {
            background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
            backdrop-filter: blur(10px);
        }

        .btn-trigger-fullscreen {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            box-shadow: 0 0 40px rgba(255, 68, 68, 0.6);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.15s ease;
            outline: none;
        }

        .btn-trigger-fullscreen:active, .btn-trigger-fullscreen.active {
            transform: scale(0.92);
        }

        .status-msg {
            font-size: 13px;
            font-weight: 700;
            color: #4CAF50;
            background: rgba(0, 0, 0, 0.8);
            padding: 6px 16px;
            border-radius: 20px;
            min-height: 20px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-msg.show { opacity: 1; }

        /* MODO CONTROLE REMOTO DUPLO */
        .remote-mode-container {
            width: 100%;
            max-width: 900px;
            margin-top: 100px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .arcade-config-panel {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 900;
            color: #4CAF50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-transform: uppercase;
        }

        .gamepad-status {
            font-size: 11px;
            font-weight: 700;
            color: #ff9800;
            background: rgba(255, 152, 0, 0.15);
            padding: 2px 8px;
            border-radius: 8px;
        }

        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }

        .arcade-row {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .arcade-info { display: flex; flex-direction: column; gap: 2px; }
        .arcade-name { font-size: 13px; font-weight: 800; }
        .arcade-key-badge { font-size: 11px; color: #4CAF50; font-weight: 700; }
        .arcade-controls { display: flex; gap: 6px; align-items: center; }

        .btn-map {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #4CAF50;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-map:active, .btn-map.recording { background: #4CAF50; color: #000; }

        .master-bar { width: 100%; margin-bottom: 16px; }

        .btn-master {
            width: 100%;
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            border: none;
            border-radius: 16px;
            padding: 16px;
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 152, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-master:active, .btn-master.active { transform: scale(0.97); }

        .cameras-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .camera-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .card-header { width: 100%; display: flex; align-items: center; justify-content: space-between; }
        .camera-title { font-size: 13px; font-weight: 900; letter-spacing: 1px; }
        .title-cam1 { color: #ff4444; }
        .title-cam2 { color: #2196F3; }

        .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; color: #4CAF50; }
        .dot { width: 6px; height: 6px; background-color: #4CAF50; border-radius: 50%; box-shadow: 0 0 6px #4CAF50; }

        .video-viewport {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-viewport img { width: 100%; height: 100%; object-fit: cover; }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(13, 15, 23, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: #a0a5c0;
        }

        .input-group { width: 100%; display: flex; flex-direction: column; gap: 4px; }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            text-align: center;
        }

        .ip-row { display: flex; gap: 6px; }
        .btn-connect {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 0 12px;
            cursor: pointer;
        }

        .btn-trigger-remote {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.15s ease;
            outline: none;
            margin-top: 6px;
        }

        .btn-cam1 { background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%); box-shadow: 0 0 30px rgba(255, 68, 68, 0.4); }
        .btn-cam2 { background: linear-gradient(135deg, #2196F3 0%, #1565C0 100%); box-shadow: 0 0 30px rgba(33, 150, 243, 0.4); }
        .btn-trigger-remote:active, .btn-trigger-remote.active { transform: scale(0.92); }
    </style>
</head>
<body>

    <header>
        <div class="logo-badge">Câmera Fullscreen + Arcade Controller</div>
    </header>

    <!-- TABS DE NAVEGAÇÃO -->
    <div class="mode-tabs">
        <button class="tab-btn active" id="tabLocal" onclick="switchTab('local')">📱 CÂMERA FULLSCREEN (MP4)</button>
        <button class="tab-btn" id="tabRemote" onclick="switchTab('remote')">📡 CONTROLE REMOTO DUPLO</button>
    </div>

    <!-- MODO 1: GRAVADOR FULLSCREEN DO CELULAR -->
    <div id="sectionLocal" class="fullscreen-cam-container">
        <video id="webCamPreview" autoplay playsinline muted></video>

        <!-- SELETOR DE TEMPOS ANTES E DEPOIS -->
        <div class="cam-time-config">
            <div class="time-box">
                <label>⏱️ ANTES DO CLIQUE</label>
                <select id="timeAntes" onchange="updateTimeConfig()">
                    <option value="5">5 Segundos</option>
                    <option value="10" selected>10 Segundos</option>
                    <option value="15">15 Segundos</option>
                    <option value="20">20 Segundos</option>
                    <option value="30">30 Segundos</option>
                </select>
            </div>
            <div class="time-box">
                <label>⏱️ DEPOIS DO CLIQUE</label>
                <select id="timeDepois" onchange="updateTimeConfig()">
                    <option value="3">3 Segundos</option>
                    <option value="5" selected>5 Segundos</option>
                    <option value="10">10 Segundos</option>
                    <option value="15">15 Segundos</option>
                </select>
            </div>
        </div>

        <!-- CONTROLES FLUTUANTES SOBRE O VÍDEO FULLSCREEN -->
        <div class="cam-overlay-controls">
            <button class="btn-cam-control" id="btnToggleCam" onclick="toggleWebCam()">📷 LIGAR CÂMERA DO CELULAR</button>

            <button class="btn-trigger-fullscreen" id="btnTriggerLocal" onclick="triggerLocalClip()">
                <div style="font-size: 32px;">⚡</div>
                <div style="font-size: 14px; font-weight: 900; letter-spacing: 1px;">CORTAR REPLAY</div>
                <div style="font-size: 9px; opacity: 0.8;" id="clipInfoText">10s Antes / 5s Depois</div>
            </button>

            <div class="status-msg" id="statusMsgLocal"></div>
        </div>
    </div>

    <!-- MODO 2: CONTROLE REMOTO DUPLO E ARCADE -->
    <div id="sectionRemote" class="remote-mode-container" style="display: none;">
        
        <div class="arcade-config-panel">
            <div class="panel-title">
                <span>🕹️ Configuração dos Botões Físicos de Arcade</span>
                <span class="gamepad-status" id="gamepadStatus">Aguardando Conexão USB/Bluetooth...</span>
            </div>
            
            <div class="arcade-grid">
                <div class="arcade-row">
                    <div class="arcade-info">
                        <div class="arcade-name">Botão Arcade 1</div>
                        <div class="arcade-key-badge" id="btnKeyBadge1">Mapeado: Tecla Espaço / Botão #0</div>
                    </div>
                    <div class="arcade-controls">
                        <select id="btnTarget1" onchange="saveArcadeMapping()">
                            <option value="local">Câmera deste Celular (MP4)</option>
                            <option value="1">Câmera 1 (Lado A)</option>
                            <option value="2">Câmera 2 (Lado B)</option>
                            <option value="both">Ambas as Remotas</option>
                        </select>
                        <button class="btn-map" id="btnMap1" onclick="startMapping(1)">🎯 Mapear</button>
                    </div>
                </div>

                <div class="arcade-row">
                    <div class="arcade-info">
                        <div class="arcade-name">Botão Arcade 2</div>
                        <div class="arcade-key-badge" id="btnKeyBadge2">Mapeado: Tecla Enter / Botão #1</div>
                    </div>
                    <div class="arcade-controls">
                        <select id="btnTarget2" onchange="saveArcadeMapping()">
                            <option value="local">Câmera deste Celular (MP4)</option>
                            <option value="1">Câmera 1 (Lado A)</option>
                            <option value="2" selected>Câmera 2 (Lado B)</option>
                            <option value="both">Ambas as Remotas</option>
                        </select>
                        <button class="btn-map" id="btnMap2" onclick="startMapping(2)">🎯 Mapear</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="master-bar">
            <button class="btn-master" id="btnMaster" onclick="sendMasterCommand()">
                <span>⚡ CORTAR AS 2 CÂMERAS AO MESMO TEMPO</span>
            </button>
        </div>

        <div class="cameras-grid">
            <div class="camera-card">
                <div class="card-header">
                    <div class="camera-title title-cam1">🎥 CÂMERA 1</div>
                    <div class="live-indicator"><div class="dot"></div><span>ONLINE</span></div>
                </div>

                <div class="video-viewport">
                    <img id="mjpegStream1" src="" alt="" onerror="onStreamError(1)" onload="onStreamLoad(1)">
                    <div class="video-overlay" id="streamOverlay1"><span id="overlayText1">Digite o IP da Câmera 1</span></div>
                </div>

                <div class="input-group">
                    <label>IP da Câmera 1 (Wi-Fi)</label>
                    <div class="ip-row">
                        <input type="text" id="cameraIp1" placeholder="Ex: 192.168.1.50">
                        <button class="btn-connect" onclick="connectStream(1)">CONECTAR</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Chave da Licença 1</label>
                    <input type="text" id="licenseKey1" placeholder="Licença Câmera 1...">
                </div>

                <button class="btn-trigger-remote btn-cam1" id="btnTrigger1" onclick="sendClipCommand(1)">
                    <div style="font-size: 28px;">⚡</div>
                    <div style="font-size: 12px; font-weight: 900;">CORTAR CÂM 1</div>
                </button>

                <div class="status-msg" id="statusMsg1"></div>
            </div>

            <div class="camera-card">
                <div class="card-header">
                    <div class="camera-title title-cam2">🎥 CÂMERA 2</div>
                    <div class="live-indicator"><div class="dot"></div><span>ONLINE</span></div>
                </div>

                <div class="video-viewport">
                    <img id="mjpegStream2" src="" alt="" onerror="onStreamError(2)" onload="onStreamLoad(2)">
                    <div class="video-overlay" id="streamOverlay2"><span id="overlayText2">Digite o IP da Câmera 2</span></div>
                </div>

                <div class="input-group">
                    <label>IP da Câmera 2 (Wi-Fi)</label>
                    <div class="ip-row">
                        <input type="text" id="cameraIp2" placeholder="Ex: 192.168.1.60">
                        <button class="btn-connect" onclick="connectStream(2)">CONECTAR</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Chave da Licença 2</label>
                    <input type="text" id="licenseKey2" placeholder="Licença Câmera 2...">
                </div>

                <button class="btn-trigger-remote btn-cam2" id="btnTrigger2" onclick="sendClipCommand(2)">
                    <div style="font-size: 28px;">⚡</div>
                    <div style="font-size: 12px; font-weight: 900;">CORTAR CÂM 2</div>
                </button>

                <div class="status-msg" id="statusMsg2"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://jmlkgxkvlrtpqukgmdqu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptbGtneGt2bHJ0cHF1a2dtZHF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxOTk3NDUsImV4cCI6MjA5OTc3NTc0NX0.mICpFr2gZfUvKmZb_RDqnw3yoswgKeaV2smZkbhb17w";

        const inputKey1 = document.getElementById('licenseKey1');
        const inputKey2 = document.getElementById('licenseKey2');
        const inputIp1 = document.getElementById('cameraIp1');
        const inputIp2 = document.getElementById('cameraIp2');

        const selectAntes = document.getElementById('timeAntes');
        const selectDepois = document.getElementById('timeDepois');
        const clipInfoText = document.getElementById('clipInfoText');

        const btnKeyBadge1 = document.getElementById('btnKeyBadge1');
        const btnKeyBadge2 = document.getElementById('btnKeyBadge2');
        const btnTarget1 = document.getElementById('btnTarget1');
        const btnTarget2 = document.getElementById('btnTarget2');
        const gamepadStatus = document.getElementById('gamepadStatus');

        let mappingTarget = null;
        let arcadeMap1 = JSON.parse(localStorage.getItem('arcade_map_1') || '{"type":"keyboard", "value":"Space", "label":"Tecla Espaço"}');
        let arcadeMap2 = JSON.parse(localStorage.getItem('arcade_map_2') || '{"type":"keyboard", "value":"Enter", "label":"Tecla Enter"}');

        let webStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isCamActive = false;
        let isProcessingClip = false;

        let segAntes = parseInt(localStorage.getItem('seg_antes') || '10');
        let segDepois = parseInt(localStorage.getItem('seg_depois') || '5');

        selectAntes.value = segAntes.toString();
        selectDepois.value = segDepois.toString();
        updateTimeText();

        function updateTimeConfig() {
            segAntes = parseInt(selectAntes.value);
            segDepois = parseInt(selectDepois.value);
            localStorage.setItem('seg_antes', segAntes);
            localStorage.setItem('seg_depois', segDepois);
            updateTimeText();
        }

        function updateTimeText() {
            clipInfoText.textContent = `${segAntes}s Antes / ${segDepois}s Depois`;
        }

        function switchTab(mode) {
            const tabLocal = document.getElementById('tabLocal');
            const tabRemote = document.getElementById('tabRemote');
            const secLocal = document.getElementById('sectionLocal');
            const secRemote = document.getElementById('sectionRemote');

            if (mode === 'local') {
                tabLocal.classList.add('active');
                tabRemote.classList.remove('active');
                secLocal.style.display = 'flex';
                secRemote.style.display = 'none';
            } else {
                tabRemote.classList.add('active');
                tabLocal.classList.remove('active');
                secLocal.style.display = 'none';
                secRemote.style.display = 'flex';
            }
        }

        async function toggleWebCam() {
            const videoElem = document.getElementById('webCamPreview');
            const btnToggle = document.getElementById('btnToggleCam');

            if (!isCamActive) {
                try {
                    webStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
                        audio: true
                    });
                    videoElem.srcObject = webStream;
                    isCamActive = true;
                    btnToggle.textContent = "🛑 DESLIGAR CÂMERA";
                    btnToggle.style.background = "#ff4444";

                    startBufferRecorder();
                } catch (err) {
                    alert("Erro ao acessar a câmera: " + err.message);
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
                if (webStream) webStream.getTracks().forEach(track => track.stop());
                videoElem.srcObject = null;
                isCamActive = false;
                btnToggle.textContent = "📷 LIGAR CÂMERA DO CELULAR";
                btnToggle.style.background = "linear-gradient(135deg, #4CAF50 0%, #388E3C 100%)";
            }
        }

        function startBufferRecorder() {
            recordedChunks = [];
            let options = { mimeType: 'video/mp4' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/webm' };

            try {
                mediaRecorder = new MediaRecorder(webStream, options);
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        recordedChunks.push(e.data);
                        // Manter o buffer suficiente para cobrir (segAntes + segDepois + 5s de segurança)
                        const maxChunks = segAntes + segDepois + 5;
                        if (recordedChunks.length > maxChunks) {
                            recordedChunks.shift();
                        }
                    }
                };
                mediaRecorder.start(1000); // 1 chunk por segundo
            } catch (e) {
                console.error("Erro MediaRecorder:", e);
            }
        }

        async function triggerLocalClip() {
            const btn = document.getElementById('btnTriggerLocal');
            const msg = document.getElementById('statusMsgLocal');

            if (!isCamActive || recordedChunks.length === 0 || isProcessingClip) return;

            if (navigator.vibrate) navigator.vibrate(80);

            isProcessingClip = true;
            btn.classList.add('active');

            // Aguardar os segundos posteriores configurados
            msg.textContent = `Aguardando ${segDepois}s posteriores... ⏱️`;
            msg.style.color = "#ff9800";
            msg.classList.add('show');

            await new Promise(r => setTimeout(r, segDepois * 1000));

            btn.classList.remove('active');

            // Recortar exatamente os chunks do período (segAntes + segDepois)
            const totalRequired = segAntes + segDepois;
            const chunksToSave = recordedChunks.slice(-totalRequired);

            const blob = new Blob(chunksToSave, { type: 'video/mp4' });
            const url = URL.createObjectURL(blob);
            
            const timeStamp = new Date().toISOString().replace(/[:.-]/g, "_").substring(0, 15);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `REPLAY_${timeStamp}.mp4`;
            a.setAttribute('type', 'video/mp4');
            
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                isProcessingClip = false;
            }, 150);

            msg.textContent = `Vídeo MP4 salvo! (${segAntes}s Antes / ${segDepois}s Depois) 🎬💾`;
            msg.style.color = "#4CAF50";
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        // Carregar licenças e seletores salvos
        if (localStorage.getItem('remote_key_1')) inputKey1.value = localStorage.getItem('remote_key_1');
        if (localStorage.getItem('remote_key_2')) inputKey2.value = localStorage.getItem('remote_key_2');
        if (localStorage.getItem('arcade_target_1')) btnTarget1.value = localStorage.getItem('arcade_target_1');
        if (localStorage.getItem('arcade_target_2')) btnTarget2.value = localStorage.getItem('arcade_target_2');

        updateBadges();

        if (localStorage.getItem('remote_ip_1')) {
            inputIp1.value = localStorage.getItem('remote_ip_1');
            connectStream(1);
        }
        if (localStorage.getItem('remote_ip_2')) {
            inputIp2.value = localStorage.getItem('remote_ip_2');
            connectStream(2);
        }

        inputKey1.addEventListener('input', () => localStorage.setItem('remote_key_1', inputKey1.value.trim()));
        inputKey2.addEventListener('input', () => localStorage.setItem('remote_key_2', inputKey2.value.trim()));

        function updateBadges() {
            btnKeyBadge1.textContent = `Mapeado: ${arcadeMap1.label}`;
            btnKeyBadge2.textContent = `Mapeado: ${arcadeMap2.label}`;
        }

        function saveArcadeMapping() {
            localStorage.setItem('arcade_target_1', btnTarget1.value);
            localStorage.setItem('arcade_target_2', btnTarget2.value);
        }

        function startMapping(btnNum) {
            mappingTarget = btnNum;
            const btnMap = document.getElementById(`btnMap${btnNum}`);
            btnMap.textContent = "Pressione o Botão...";
            btnMap.classList.add('recording');
        }

        function finishMapping(type, value, label) {
            if (mappingTarget === 1) {
                arcadeMap1 = { type, value, label };
                localStorage.setItem('arcade_map_1', JSON.stringify(arcadeMap1));
                document.getElementById('btnMap1').textContent = "🎯 Mapear";
                document.getElementById('btnMap1').classList.remove('recording');
            } else if (mappingTarget === 2) {
                arcadeMap2 = { type, value, label };
                localStorage.setItem('arcade_map_2', JSON.stringify(arcadeMap2));
                document.getElementById('btnMap2').textContent = "🎯 Mapear";
                document.getElementById('btnMap2').classList.remove('recording');
            }
            mappingTarget = null;
            updateBadges();
        }

        function connectStream(camNum) {
            const ipInput = camNum === 1 ? inputIp1 : inputIp2;
            const img = document.getElementById(`mjpegStream${camNum}`);
            const overlay = document.getElementById(`streamOverlay${camNum}`);
            const overlayText = document.getElementById(`overlayText${camNum}`);

            const ip = ipInput.value.trim();
            if (!ip) return;
            localStorage.setItem(`remote_ip_${camNum}`, ip);

            overlayText.textContent = `Conectando Câmera ${camNum}...`;
            overlay.style.display = "flex";

            img.src = `http://${ip}:8080/stream?t=${Date.now()}`;
        }

        function onStreamLoad(camNum) {
            document.getElementById(`streamOverlay${camNum}`).style.display = "none";
        }

        function onStreamError(camNum) {
            document.getElementById(`streamOverlay${camNum}`).style.display = "flex";
            document.getElementById(`overlayText${camNum}`).textContent = `Câmera ${camNum} Offline ou IP Incorreto`;
        }

        async function postCommand(key) {
            if (!key) return false;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/replay_commands`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ license_key: key, command: 'TRIGGER_CLIP' })
                });
                return response.ok;
            } catch (_) {
                return false;
            }
        }

        async function triggerByTarget(target) {
            if (target === "local") {
                triggerLocalClip();
            } else if (target === "1") {
                sendClipCommand(1);
            } else if (target === "2") {
                sendClipCommand(2);
            } else if (target === "both") {
                sendMasterCommand();
            }
        }

        async function sendClipCommand(camNum) {
            const btn = document.getElementById(`btnTrigger${camNum}`);
            const keyInput = camNum === 1 ? inputKey1 : inputKey2;
            const key = keyInput.value.trim();

            if (!key) {
                alert(`Por favor, digite a chave da Licença da Câmera ${camNum}!`);
                keyInput.focus();
                return;
            }

            if (navigator.vibrate) navigator.vibrate(80);

            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 150);

            const ok = await postCommand(key);
            showStatus(camNum, ok ? `Câmera ${camNum} Cortada! 🚀` : "Erro ao enviar", ok ? "#4CAF50" : "#ff4444");
        }

        async function sendMasterCommand() {
            const btn = document.getElementById('btnMaster');
            const key1 = inputKey1.value.trim();
            const key2 = inputKey2.value.trim();

            if (!key1 && !key2) {
                alert("Digite a chave de ao menos uma câmera!");
                return;
            }

            if (navigator.vibrate) navigator.vibrate([80, 50, 80]);

            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 150);

            const res1 = key1 ? postCommand(key1) : Promise.resolve(false);
            const res2 = key2 ? postCommand(key2) : Promise.resolve(false);

            const [ok1, ok2] = await Promise.all([res1, res2]);

            if (key1) showStatus(1, ok1 ? "Câmera 1 Cortada! 🚀" : "Erro", ok1 ? "#4CAF50" : "#ff4444");
            if (key2) showStatus(2, ok2 ? "Câmera 2 Cortada! 🚀" : "Erro", ok2 ? "#4CAF50" : "#ff4444");
        }

        function showStatus(camNum, text, color) {
            const msg = document.getElementById(`statusMsg${camNum}`);
            msg.textContent = text;
            msg.style.color = color;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        /* --- MAPEAMENTO E ESCUTA DE TECLAS DO TECLADO / TECLADO ARCADE --- */
        document.addEventListener('keydown', (event) => {
            if ([inputKey1, inputKey2, inputIp1, inputIp2].includes(document.activeElement)) return;

            const code = event.code || event.key;

            if (mappingTarget !== null) {
                event.preventDefault();
                finishMapping('keyboard', code, `Tecla: ${code}`);
                return;
            }

            if (arcadeMap1.type === 'keyboard' && (code === arcadeMap1.value || (arcadeMap1.value === 'Space' && event.key === ' '))) {
                event.preventDefault();
                triggerByTarget(btnTarget1.value);
            } else if (arcadeMap2.type === 'keyboard' && (code === arcadeMap2.value || (arcadeMap2.value === 'Space' && event.key === ' '))) {
                event.preventDefault();
                triggerByTarget(btnTarget2.value);
            }
        });

        /* --- MAPEAMENTO E ESCUTA DAS PLACAS DE ARCADE USB (GAMEPAD HID API) --- */
        window.addEventListener("gamepadconnected", (e) => {
            gamepadStatus.textContent = `🕹️ Placa Arcade USB Conectada (${e.gamepad.id.substring(0, 20)}...)`;
            gamepadStatus.style.color = "#4CAF50";
            gamepadStatus.style.background = "rgba(76, 175, 80, 0.15)";
        });

        window.addEventListener("gamepaddisconnected", () => {
            gamepadStatus.textContent = "Aguardando Conexão USB/Bluetooth...";
            gamepadStatus.style.color = "#ff9800";
            gamepadStatus.style.background = "rgba(255, 152, 0, 0.15)";
        });

        let lastGamepadBtnState = {};

        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (let gIndex = 0; gIndex < gamepads.length; gIndex++) {
                const gp = gamepads[gIndex];
                if (gp && gp.buttons) {
                    for (let bIndex = 0; bIndex < gp.buttons.length; bIndex++) {
                        const isPressed = gp.buttons[bIndex].pressed;
                        const keyState = `g${gIndex}_b${bIndex}`;

                        if (isPressed && !lastGamepadBtnState[keyState]) {
                            lastGamepadBtnState[keyState] = true;

                            if (mappingTarget !== null) {
                                finishMapping('gamepad', bIndex, `Botão Arcade USB #${bIndex + 1}`);
                                break;
                            }

                            if (arcadeMap1.type === 'gamepad' && arcadeMap1.value === bIndex) {
                                triggerByTarget(btnTarget1.value);
                            } else if (arcadeMap2.type === 'gamepad' && arcadeMap2.value === bIndex) {
                                triggerByTarget(btnTarget2.value);
                            }

                        } else if (!isPressed) {
                            lastGamepadBtnState[keyState] = false;
                        }
                    }
                }
            }
            requestAnimationFrame(pollGamepad);
        }

        requestAnimationFrame(pollGamepad);
    </script>
</body>
</html>
