<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Recortes - Controle Remoto Duplo 🎬</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0f17;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 68, 68, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(33, 150, 243, 0.15) 0px, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        header {
            text-align: center;
            margin-top: 8px;
            margin-bottom: 16px;
        }

        .logo-badge {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #a0a5c0;
            display: inline-block;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #a0a5c0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* BOTÃO MESTRE AMBAS AS CÂMERAS */
        .master-bar {
            width: 100%;
            max-width: 900px;
            margin-bottom: 16px;
        }

        .btn-master {
            width: 100%;
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            border: none;
            border-radius: 16px;
            padding: 16px;
            color: #fff;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 152, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s ease;
        }

        .btn-master:active, .btn-master.active {
            transform: scale(0.97);
        }

        /* GRID DAS DUAS CÂMERAS */
        .cameras-grid {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .camera-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .card-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .camera-title {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-cam1 { color: #ff4444; }
        .title-cam2 { color: #2196F3; }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 800;
            color: #4CAF50;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #4CAF50;
            border-radius: 50%;
            box-shadow: 0 0 6px #4CAF50;
        }

        /* VISOR DE VÍDEO */
        .video-viewport {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-viewport img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(13, 15, 23, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #a0a5c0;
        }

        /* INPUTS */
        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 10px;
            font-weight: 600;
            color: #8a8fa8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 8px 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            text-align: center;
        }

        .ip-row {
            display: flex;
            gap: 6px;
        }

        .btn-connect {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 0 12px;
            cursor: pointer;
        }

        /* BOTÃO DE CORTE DA CÂMERA */
        .btn-trigger {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.15s ease;
            outline: none;
            margin-top: 8px;
        }

        .btn-cam1 {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.4);
        }

        .btn-cam2 {
            background: linear-gradient(135deg, #2196F3 0%, #1565C0 100%);
            box-shadow: 0 0 30px rgba(33, 150, 243, 0.4);
        }

        .btn-trigger:active, .btn-trigger.active {
            transform: scale(0.92);
        }

        .btn-icon { font-size: 30px; }
        .btn-text { font-size: 13px; font-weight: 900; letter-spacing: 1px; }

        .hotkey-tag {
            font-size: 10px;
            color: #a0a5c0;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 2px;
        }

        .status-msg {
            font-size: 12px;
            font-weight: 600;
            min-height: 16px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-msg.show { opacity: 1; }

        footer {
            font-size: 11px;
            color: #5a5f78;
            text-align: center;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-badge">Painel de Controle Remoto Duplo</div>
        <h1>Meus Recortes 🎬</h1>
    </header>

    <!-- BARRA DO BOTÃO MESTRE (CORTAR AMBAS) -->
    <div class="master-bar">
        <button class="btn-master" id="btnMaster" onclick="sendMasterCommand()">
            <span>⚡ CORTAR AS 2 CÂMERAS AO MESMO TEMPO</span>
            <span class="hotkey-tag">[Tecla 'A' / Botão Mestre]</span>
        </button>
    </div>

    <!-- GRID DAS DUAS CÂMERAS -->
    <div class="cameras-grid">

        <!-- CÂMERA 1 (LADO A / VERMELHO) -->
        <div class="camera-card">
            <div class="card-header">
                <div class="camera-title title-cam1">🎥 CÂMERA 1</div>
                <div class="live-indicator"><div class="dot"></div><span>ONLINE</span></div>
            </div>

            <div class="video-viewport">
                <img id="mjpegStream1" src="" alt="" onerror="onStreamError(1)" onload="onStreamLoad(1)">
                <div class="video-overlay" id="streamOverlay1">
                    <span id="overlayText1">Digite o IP da Câmera 1</span>
                </div>
            </div>

            <div class="input-group">
                <label>IP da Câmera 1 (Wi-Fi)</label>
                <div class="ip-row">
                    <input type="text" id="cameraIp1" placeholder="Ex: 192.168.1.50">
                    <button class="btn-connect" onclick="connectStream(1)">CONECTAR</button>
                </div>
            </div>

            <div class="input-group">
                <label>Chave da Licença 1</label>
                <input type="text" id="licenseKey1" placeholder="Licença Câmera 1...">
            </div>

            <button class="btn-trigger btn-cam1" id="btnTrigger1" onclick="sendClipCommand(1)">
                <div class="btn-icon">⚡</div>
                <div class="btn-text">CORTAR CÂM 1</div>
                <div class="hotkey-tag">[Espaço]</div>
            </button>

            <div class="status-msg" id="statusMsg1"></div>
        </div>

        <!-- CÂMERA 2 (LADO B / AZUL) -->
        <div class="camera-card">
            <div class="card-header">
                <div class="camera-title title-cam2">🎥 CÂMERA 2</div>
                <div class="live-indicator"><div class="dot"></div><span>ONLINE</span></div>
            </div>

            <div class="video-viewport">
                <img id="mjpegStream2" src="" alt="" onerror="onStreamError(2)" onload="onStreamLoad(2)">
                <div class="video-overlay" id="streamOverlay2">
                    <span id="overlayText2">Digite o IP da Câmera 2</span>
                </div>
            </div>

            <div class="input-group">
                <label>IP da Câmera 2 (Wi-Fi)</label>
                <div class="ip-row">
                    <input type="text" id="cameraIp2" placeholder="Ex: 192.168.1.60">
                    <button class="btn-connect" onclick="connectStream(2)">CONECTAR</button>
                </div>
            </div>

            <div class="input-group">
                <label>Chave da Licença 2</label>
                <input type="text" id="licenseKey2" placeholder="Licença Câmera 2...">
            </div>

            <button class="btn-trigger btn-cam2" id="btnTrigger2" onclick="sendClipCommand(2)">
                <div class="btn-icon">⚡</div>
                <div class="btn-text">CORTAR CÂM 2</div>
                <div class="hotkey-tag">[Enter]</div>
            </button>

            <div class="status-msg" id="statusMsg2"></div>
        </div>

    </div>

    <footer>
        Supabase Cloud Dual Control • Meus Recortes Arcade
    </footer>

    <script>
        const SUPABASE_URL = "https://jmlkgxkvlrtpqukgmdqu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptbGtneGt2bHJ0cHF1a2dtZHF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxOTk3NDUsImV4cCI6MjA5OTc3NTc0NX0.mICpFr2gZfUvKmZb_RDqnw3yoswgKeaV2smZkbhb17w";

        const inputKey1 = document.getElementById('licenseKey1');
        const inputKey2 = document.getElementById('licenseKey2');
        const inputIp1 = document.getElementById('cameraIp1');
        const inputIp2 = document.getElementById('cameraIp2');

        // Carregar licenças e IPs salvos no localStorage
        if (localStorage.getItem('remote_key_1')) inputKey1.value = localStorage.getItem('remote_key_1');
        if (localStorage.getItem('remote_key_2')) inputKey2.value = localStorage.getItem('remote_key_2');
        
        if (localStorage.getItem('remote_ip_1')) {
            inputIp1.value = localStorage.getItem('remote_ip_1');
            connectStream(1);
        }
        if (localStorage.getItem('remote_ip_2')) {
            inputIp2.value = localStorage.getItem('remote_ip_2');
            connectStream(2);
        }

        inputKey1.addEventListener('input', () => localStorage.setItem('remote_key_1', inputKey1.value.trim()));
        inputKey2.addEventListener('input', () => localStorage.setItem('remote_key_2', inputKey2.value.trim()));

        function connectStream(camNum) {
            const ipInput = camNum === 1 ? inputIp1 : inputIp2;
            const img = document.getElementById(`mjpegStream${camNum}`);
            const overlay = document.getElementById(`streamOverlay${camNum}`);
            const overlayText = document.getElementById(`overlayText${camNum}`);

            const ip = ipInput.value.trim();
            if (!ip) return;
            localStorage.setItem(`remote_ip_${camNum}`, ip);

            overlayText.textContent = `Conectando Câmera ${camNum}...`;
            overlay.style.display = "flex";

            img.src = `http://${ip}:8080/stream?t=${Date.now()}`;
        }

        function onStreamLoad(camNum) {
            document.getElementById(`streamOverlay${camNum}`).style.display = "none";
        }

        function onStreamError(camNum) {
            document.getElementById(`streamOverlay${camNum}`).style.display = "flex";
            document.getElementById(`overlayText${camNum}`).textContent = `Câmera ${camNum} Offline ou IP Incorreto`;
        }

        async function postCommand(key) {
            if (!key) return false;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/replay_commands`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ license_key: key, command: 'TRIGGER_CLIP' })
                });
                return response.ok;
            } catch (_) {
                return false;
            }
        }

        async function sendClipCommand(camNum) {
            const btn = document.getElementById(`btnTrigger${camNum}`);
            const keyInput = camNum === 1 ? inputKey1 : inputKey2;
            const key = keyInput.value.trim();

            if (!key) {
                alert(`Por favor, digite a chave da Licença da Câmera ${camNum}!`);
                keyInput.focus();
                return;
            }

            if (navigator.vibrate) navigator.vibrate(80);

            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 150);

            const ok = await postCommand(key);
            showStatus(camNum, ok ? `Câmera ${camNum} Cortada! 🚀` : "Erro ao enviar", ok ? "#4CAF50" : "#ff4444");
        }

        async function sendMasterCommand() {
            const btn = document.getElementById('btnMaster');
            const key1 = inputKey1.value.trim();
            const key2 = inputKey2.value.trim();

            if (!key1 && !key2) {
                alert("Digite a chave de ao menos uma câmera!");
                return;
            }

            if (navigator.vibrate) navigator.vibrate([80, 50, 80]);

            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 150);

            const res1 = key1 ? postCommand(key1) : Promise.resolve(false);
            const res2 = key2 ? postCommand(key2) : Promise.resolve(false);

            const [ok1, ok2] = await Promise.all([res1, res2]);

            if (key1) showStatus(1, ok1 ? "Câmera 1 Cortada! 🚀" : "Erro", ok1 ? "#4CAF50" : "#ff4444");
            if (key2) showStatus(2, ok2 ? "Câmera 2 Cortada! 🚀" : "Erro", ok2 ? "#4CAF50" : "#ff4444");
        }

        function showStatus(camNum, text, color) {
            const msg = document.getElementById(`statusMsg${camNum}`);
            msg.textContent = text;
            msg.style.color = color;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        /* --- SUPORTE A BOTÕES DE ARCADE FÍSICOS DA QUADRA --- */
        document.addEventListener('keydown', (event) => {
            if ([inputKey1, inputKey2, inputIp1, inputIp2].includes(document.activeElement)) return;

            // Tecla Espaço = Câmera 1
            if (event.code === 'Space' || event.key === ' ') {
                event.preventDefault();
                sendClipCommand(1);
            }
            // Tecla Enter = Câmera 2
            else if (event.code === 'Enter' || event.code === 'NumpadEnter') {
                event.preventDefault();
                sendClipCommand(2);
            }
            // Tecla 'A' ou 'M' = AMBAS AS CÂMERAS
            else if (event.key.toLowerCase() === 'a' || event.key.toLowerCase() === 'm') {
                event.preventDefault();
                sendMasterCommand();
            }
        });

        /* --- SUPORTE A CONTROLES / FLIPERAMAS USB (GAMEPAD API) --- */
        window.addEventListener("gamepadconnected", () => pollGamepad());
        let lastState = {};
        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (const gp of gamepads) {
                if (gp) {
                    // Botão 0 (A/X) = Câmera 1
                    if (gp.buttons[0] && gp.buttons[0].pressed && !lastState['b0']) {
                        lastState['b0'] = true;
                        sendClipCommand(1);
                    } else if (gp.buttons[0] && !gp.buttons[0].pressed) {
                        lastState['b0'] = false;
                    }

                    // Botão 1 (B/Circle) = Câmera 2
                    if (gp.buttons[1] && gp.buttons[1].pressed && !lastState['b1']) {
                        lastState['b1'] = true;
                        sendClipCommand(2);
                    } else if (gp.buttons[1] && !gp.buttons[1].pressed) {
                        lastState['b1'] = false;
                    }

                    // Botão 2 (X/Square) ou Botão 3 = Ambas
                    if (gp.buttons[2] && gp.buttons[2].pressed && !lastState['b2']) {
                        lastState['b2'] = true;
                        sendMasterCommand();
                    } else if (gp.buttons[2] && !gp.buttons[2].pressed) {
                        lastState['b2'] = false;
                    }
                }
            }
            requestAnimationFrame(pollGamepad);
        }
    </script>
</body>
</html>
