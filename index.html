<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meus Recortes - Câmera & Galeria Pro 🎬</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #080a10;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* TELA DE BLOQUEIO DE LICENÇA (Sempre Visível Inicialmente) */
        .lock-screen-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0d111d 0%, #080a10 100%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lock-box {
            width: 100%;
            max-width: 420px;
            background: rgba(18, 22, 36, 0.6);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .lock-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ff2a2a 0%, #ff7a00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lock-subtitle {
            font-size: 13px;
            color: #a0a5c0;
            line-height: 1.5;
        }

        .lock-input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .lock-input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            text-align: center;
            letter-spacing: 1.5px;
            transition: border-color 0.25s ease;
        }

        .lock-input-group input:focus {
            border-color: #ff2a2a;
        }

        .btn-validate-license {
            width: 100%;
            background: linear-gradient(135deg, #ff2a2a 0%, #b30000 100%);
            border: none;
            border-radius: 14px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 42, 42, 0.4);
            transition: transform 0.15s ease;
        }

        .btn-validate-license:active {
            transform: scale(0.97);
        }

        .lock-error-msg {
            font-size: 12px;
            font-weight: 700;
            color: #ff4444;
            min-height: 18px;
        }

        /* ESTILOS DO APP (SÓ ENTRAM EM AÇÃO APÓS DESBLOQUEADO) */
        .mode-tabs {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            gap: 8px;
            width: 94%;
            max-width: 520px;
            background: rgba(13, 16, 26, 0.75);
            backdrop-filter: blur(20px);
            padding: 6px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .mode-tabs.hidden-ui {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -20px);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            border-radius: 14px;
            border: 1px solid transparent;
            background: transparent;
            color: #8f96b3;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff2a2a 0%, #b30000 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(255, 42, 42, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .fullscreen-cam-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        video#webCamPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .toggle-ui-btn {
            position: fixed;
            top: 66px;
            right: 16px;
            z-index: 60;
            background: rgba(13, 16, 26, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }

        .cam-time-config {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(13, 16, 26, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .cam-time-config.hidden-ui {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -20px);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .time-box label {
            font-size: 9px;
            font-weight: 800;
            color: #a0a5c0;
            text-transform: uppercase;
        }

        .time-box select {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            outline: none;
        }

        .cam-overlay-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 90%;
            max-width: 380px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .btn-cam-control.hidden-ui {
            display: none !important;
        }

        .btn-cam-control {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: #fff;
            padding: 10px 22px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
            backdrop-filter: blur(10px);
        }

        .btn-trigger-fullscreen {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.35);
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000 70%);
            box-shadow: 
                0 0 40px rgba(255, 42, 42, 0.6),
                inset 0 4px 15px rgba(255, 255, 255, 0.6),
                inset 0 -6px 20px rgba(0, 0, 0, 0.7);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            outline: none;
            position: relative;
            transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.12s ease;
        }

        .pulse-ring-modern {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(255, 77, 77, 0.6);
            animation: ringPulse 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            pointer-events: none;
        }

        @keyframes ringPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.25); opacity: 0; }
        }

        .btn-trigger-fullscreen.fired {
            animation: fireShockwave 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: radial-gradient(circle at 30% 30%, #10b981, #047857 70%) !important;
            box-shadow: 0 0 60px rgba(16, 185, 129, 0.9), inset 0 4px 15px rgba(255, 255, 255, 0.8) !important;
            border-color: #10b981 !important;
        }

        @keyframes fireShockwave {
            0% { transform: scale(0.85); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .screen-flash-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 185, 129, 0.35);
            backdrop-filter: blur(4px);
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .screen-flash-overlay.flash {
            opacity: 1;
        }

        .status-msg {
            font-size: 13px;
            font-weight: 800;
            color: #10b981;
            background: rgba(8, 10, 16, 0.92);
            padding: 8px 18px;
            border-radius: 20px;
            min-height: 20px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .status-msg.show { opacity: 1; }

        .gallery-container {
            width: 100%;
            max-width: 900px;
            margin-top: 80px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .gallery-title {
            font-size: 16px;
            font-weight: 900;
            color: #ff9800;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .replays-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .replay-card {
            background: rgba(18, 22, 36, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .replay-card video {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            background: #000;
            object-fit: cover;
        }

        .replay-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #a0a5c0;
        }

        .replay-actions { display: flex; gap: 8px; }

        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: none;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-download { background: #10b981; color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-delete { background: rgba(255, 42, 42, 0.15); border: 1px solid #ff2a2a; color: #ff2a2a; }

        .remote-mode-container {
            width: 100%;
            max-width: 900px;
            margin-top: 80px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            max-height: calc(100vh - 90px);
        }

        .arcade-config-panel {
            width: 100%;
            background: rgba(18, 22, 36, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-size: 12px;
            font-weight: 900;
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-transform: uppercase;
        }

        .gamepad-status {
            font-size: 11px;
            font-weight: 700;
            color: #ff9800;
            background: rgba(255, 152, 0, 0.15);
            padding: 2px 8px;
            border-radius: 8px;
        }

        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }

        .arcade-row {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .arcade-info { display: flex; flex-direction: column; gap: 2px; }
        .arcade-name { font-size: 13px; font-weight: 800; }
        .arcade-key-badge { font-size: 11px; color: #10b981; font-weight: 700; }
        .arcade-controls { display: flex; gap: 6px; align-items: center; }

        .btn-map {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-map:active, .btn-map.recording { background: #10b981; color: #000; }

        .master-bar { width: 100%; margin-bottom: 16px; }

        .btn-master {
            width: 100%;
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            border: none;
            border-radius: 18px;
            padding: 16px;
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 152, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-master:active, .btn-master.active { transform: scale(0.97); }

        .cameras-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .camera-card {
            background: rgba(18, 22, 36, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-header { width: 100%; display: flex; align-items: center; justify-content: space-between; }
        .camera-title { font-size: 13px; font-weight: 900; letter-spacing: 1px; }
        .title-cam1 { color: #ff2a2a; }
        .title-cam2 { color: #2196F3; }

        .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; color: #10b981; }
        .dot { width: 6px; height: 6px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 6px #10b981; }

        .video-viewport {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .video-viewport img { width: 100%; height: 100%; object-fit: cover; }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 10, 16, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: #a0a5c0;
        }

        .input-group { width: 100%; display: flex; flex-direction: column; gap: 4px; }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            text-align: center;
        }

        .ip-row { display: flex; gap: 6px; }
        .btn-connect {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 0 14px;
            cursor: pointer;
        }

        .btn-trigger-remote {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            outline: none;
            margin-top: 6px;
        }

        .btn-cam1 { background: linear-gradient(135deg, #ff2a2a 0%, #cc0000 100%); box-shadow: 0 0 30px rgba(255, 42, 42, 0.4); }
        .btn-cam2 { background: linear-gradient(135deg, #2196F3 0%, #1565C0 100%); box-shadow: 0 0 30px rgba(33, 150, 243, 0.4); }
        .btn-trigger-remote:active, .btn-trigger-remote.active { transform: scale(0.92); }
    </style>
</head>
<body>

    <!-- OVERLAY DE BLOQUEIO DE LICENÇA (Sempre Presente Inicialmente) -->
    <div id="lockScreen" class="lock-screen-container">
        <div class="lock-box">
            <div class="lock-logo">Meus Recortes 🎬</div>
            <p class="lock-subtitle">Insira uma chave de licença ativa para acessar o sistema web de gravação e controle</p>
            <div class="lock-input-group">
                <input type="text" id="webLicenseInput" placeholder="DIGITE SUA LICENÇA...">
                <button class="btn-validate-license" id="btnValidate" onclick="validateWebLicense()">VALIDAR ACESSO</button>
            </div>
            <div id="lockErrorMsg" class="lock-error-msg"></div>
        </div>
    </div>

    <!-- TEMPLATE DO APLICATIVO PRINCIPAL (Proteção Física contra Burla Visual F12) -->
    <template id="appTemplate">
        <div class="screen-flash-overlay" id="screenFlash"></div>

        <button class="toggle-ui-btn" id="btnToggleUI" onclick="toggleUIAndFullscreen()" title="Ocultar/Exibir Controles">👁️</button>

        <div class="mode-tabs" id="modeTabs">
            <button class="tab-btn active" id="tabLocal" onclick="switchTab('local')">📱 CÂMERA FULLSCREEN</button>
            <button class="tab-btn" id="tabGallery" onclick="switchTab('gallery')">📼 REPLAYS SALVOS</button>
            <button class="tab-btn" id="tabRemote" onclick="switchTab('remote')">📡 REMOTO (2 CÂMS)</button>
        </div>

        <div id="sectionLocal" class="fullscreen-cam-container" onclick="handleViewportClick(event)">
            <video id="webCamPreview" autoplay playsinline muted></video>

            <div class="cam-time-config" id="camTimeConfig">
                <div class="time-box">
                    <label>⏱️ ANTES DO CLIQUE</label>
                    <select id="timeAntes" onchange="updateTimeConfig()">
                        <option value="5">5 Segundos</option>
                        <option value="10" selected>10 Segundos</option>
                        <option value="15">15 Segundos</option>
                        <option value="20">20 Segundos</option>
                        <option value="30">30 Segundos</option>
                    </select>
                </div>
                <div class="time-box">
                    <label>⏱️ DEPOIS DO CLIQUE</label>
                    <select id="timeDepois" onchange="updateTimeConfig()">
                        <option value="3">3 Segundos</option>
                        <option value="5" selected>5 Segundos</option>
                        <option value="10">10 Segundos</option>
                        <option value="15">15 Segundos</option>
                    </select>
                </div>
            </div>

            <div class="cam-overlay-controls" id="camOverlayControls">
                <button class="btn-cam-control" id="btnToggleCam" onclick="toggleWebCam(event)">📷 LIGAR CÂMERA DO CELULAR</button>

                <button class="btn-trigger-fullscreen" id="btnTriggerLocal" onclick="triggerLocalClip(event)">
                    <div class="pulse-ring-modern"></div>
                    <div style="font-size: 34px;" id="btnIconLocal">⚡</div>
                    <div style="font-size: 14px; font-weight: 900; letter-spacing: 1px;" id="btnTextLocal">CORTAR REPLAY</div>
                    <div style="font-size: 9px; opacity: 0.8;" id="clipInfoText">10s Antes / 5s Depois</div>
                </button>

                <div class="status-msg" id="statusMsgLocal"></div>
            </div>
        </div>

        <div id="sectionGallery" class="gallery-container" style="display: none;">
            <div class="gallery-title">
                <span>📼 Galeria de Replays Salvos no Celular</span>
                <button class="btn-action btn-delete" onclick="clearAllReplays()" style="width: auto; padding: 4px 10px;">🗑️ Limpar Todos</button>
            </div>

            <div class="replays-list" id="replaysList">
                <div style="text-align: center; color: #a0a5c0; grid-column: 1/-1; padding: 40px;">Nenhum replay salvo ainda. Ligue a câmera e corte o primeiro lance!</div>
            </div>
        </div>

        <div id="sectionRemote" class="remote-mode-container" style="display: none;">
            <div class="arcade-config-panel">
                <div class="panel-title">
                    <span>🕹️ Configuração dos Botões Físicos de Arcade</span>
                    <span class="gamepad-status" id="gamepadStatus">Aguardando Conexão USB/Bluetooth...</span>
                </div>
                
                <div class="arcade-grid">
                    <div class="arcade-row">
                        <div class="arcade-info">
                            <div class="arcade-name">Botão Arcade 1</div>
                            <div class="arcade-key-badge" id="btnKeyBadge1">Mapeado: Tecla Espaço / Botão #0</div>
                        </div>
                        <div class="arcade-controls">
                            <select id="btnTarget1" onchange="saveArcadeMapping()">
                                <option value="local">Câmera deste Celular (MP4)</option>
                                <option value="1">Câmera 1 (Lado A)</option>

        async function verifyAndAssociateLicense(key) {
            if (!key) return false;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/licenses?license_key=eq.${encodeURIComponent(key.trim())}&select=*`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!response.ok) return false;
                const data = await response.json();
                if (!data || data.length === 0) return false;

                const license = data[0];

                if (license.is_active !== true) return false;

                const dbDeviceId = license.device_id;
                
                if (!dbDeviceId || dbDeviceId === "null" || dbDeviceId === "") {
                    const associateRes = await associateWebDevice(key, webDeviceId);
                    return associateRes;
                }

                if (dbDeviceId !== webDeviceId) {
                    console.warn("Licença em uso por outro aparelho:", dbDeviceId);
                    return false;
                }

                return true;
            } catch (_) {
                return false;
            }
        }

        async function associateWebDevice(key, devId) {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/licenses?license_key=eq.${encodeURIComponent(key.trim())}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        device_id: devId,
                        activated_at: new Date().toISOString()
                    })
                });
                return response.ok;
            } catch (_) {
                return false;
            }
        }

        async function validateWebLicense() {
            const key = webLicenseInput.value.trim().toUpperCase();

            if (!key) {
                lockErrorMsg.textContent = "Digite uma chave de licença!";
                return;
            }

            btnValidate.textContent = "VERIFICANDO...";
            btnValidate.disabled = true;
            lockErrorMsg.textContent = "";

            const valid = await verifyAndAssociateLicense(key);
            btnValidate.textContent = "VALIDAR ACESSO";
            btnValidate.disabled = false;

            if (valid) {
                localStorage.setItem('user_license', key);
                unlockAppLayout(key);
            } else {
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/licenses?license_key=eq.${encodeURIComponent(key)}&select=*`, {
                        method: 'GET',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });
                    const data = await response.json();
                    if (data && data.length > 0) {
                        const lic = data[0];
                        if (lic.is_active !== true) {
                            lockErrorMsg.textContent = "Esta licença foi desativada pelo administrador!";
                        } else if (lic.device_id && lic.device_id !== webDeviceId) {
                            lockErrorMsg.textContent = "Esta licença já está em uso em outro aparelho!";
                        } else {
                            lockErrorMsg.textContent = "Falha ao validar a licença. Tente novamente.";
                        }
                    } else {
                        lockErrorMsg.textContent = "Licença inválida ou inexistente!";
                    }
                } catch (_) {
                    lockErrorMsg.textContent = "Chave de licença inválida ou sem conexão!";
                }
            }
        }

        /* --- INDEXEDDB PARA SALVAR REPLAYS NO CELULAR --- */
        let db;
        function initIndexedDB() {
            const request = indexedDB.open("MeusRecortesDB", 1);
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                if (!db.objectStoreNames.contains("replays")) {
                    db.createObjectStore("replays", { keyPath: "id", autoIncrement: true });
                }
            };
            request.onsuccess = (e) => {
                db = e.target.result;
                loadGalleryReplays();
            };
        }

        function saveReplayToDB(blob, name) {
            if (!db) return;
            const transaction = db.transaction(["replays"], "readwrite");
            const store = transaction.objectStore("replays");
            const replayItem = {
                name: name,
                date: new Date().toLocaleString("pt-BR"),
                blob: blob
            };
            store.add(replayItem);
            transaction.oncomplete = () => {
                loadGalleryReplays();
            };
        }

        function loadGalleryReplays() {
            if (!db) return;
            const replaysList = document.getElementById('replaysList');
            if (!replaysList) return;
            const transaction = db.transaction(["replays"], "readonly");
            const store = transaction.objectStore("replays");
            const getRequest = store.getAll();

            getRequest.onsuccess = () => {
                const items = getRequest.result;
                if (!items || items.length === 0) {
                    replaysList.innerHTML = `<div style="text-align: center; color: #a0a5c0; grid-column: 1/-1; padding: 40px;">Nenhum replay salvo ainda. Ligue a câmera e corte o primeiro lance!</div>`;
                    return;
                }

                replaysList.innerHTML = items.reverse().map(item => {
                    const videoUrl = URL.createObjectURL(item.blob);
                    return `
                        <div class="replay-card">
                            <video src="${videoUrl}" controls playsinline></video>
                            <div class="replay-meta">
                                <span>📅 ${item.date}</span>
                                <span>📹 ${item.name}</span>
                            </div>
                            <div class="replay-actions">
                                <button class="btn-action btn-download" onclick="downloadReplayBlob(${item.id})">💾 Baixar MP4</button>
                                <button class="btn-action btn-delete" onclick="deleteReplayFromDB(${item.id})">🗑️ Apagar</button>
                            </div>
                        </div>
                    `;
                }).join('');
            };
        }

        function downloadReplayBlob(id) {
            const transaction = db.transaction(["replays"], "readonly");
            const store = transaction.objectStore("replays");
            const getReq = store.get(id);
            getReq.onsuccess = () => {
                const item = getReq.result;
                if (!item) return;
                const url = URL.createObjectURL(item.blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = item.name;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 150);
            };
        }

        function deleteReplayFromDB(id) {
            const transaction = db.transaction(["replays"], "readwrite");
            const store = transaction.objectStore("replays");
            store.delete(id);
            transaction.oncomplete = () => loadGalleryReplays();
        }

        function clearAllReplays() {
            if (!confirm("Tem certeza que deseja apagar todos os replays salvos no celular?")) return;
            const transaction = db.transaction(["replays"], "readwrite");
            const store = transaction.objectStore("replays");
            store.clear();
            transaction.oncomplete = () => loadGalleryReplays();
        }

        async function toggleWebCam(e) {
            if (e) e.stopPropagation();
            const videoElem = document.getElementById('webCamPreview');
            const btnToggle = document.getElementById('btnToggleCam');

            if (!isCamActive) {
                try {
                    webStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: true
                    });
                    videoElem.srcObject = webStream;
                    isCamActive = true;
                    btnToggle.textContent = "🛑 DESLIGAR CÂMERA";
                    btnToggle.style.background = "#ff2a2a";

                    startBufferRecorder();
                } catch (err) {
                    alert("Erro ao acessar a câmera: " + err.message);
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
                if (webStream) webStream.getTracks().forEach(track => track.stop());
                videoElem.srcObject = null;
                isCamActive = false;
                btnToggle.textContent = "📷 LIGAR CÂMERA DO CELULAR";
                btnToggle.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)";
            }
        }

        function startBufferRecorder() {
            recordedChunks = [];
            initHeaderChunk = null;
            let options = { mimeType: 'video/webm' };
            if (MediaRecorder.isTypeSupported('video/mp4')) options = { mimeType: 'video/mp4' };

            try {
                mediaRecorder = new MediaRecorder(webStream, options);
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        const now = Date.now();
                        if (!initHeaderChunk) {
                            initHeaderChunk = e.data;
                        }
                        recordedChunks.push({
                            data: e.data,
                            timestamp: now
                        });
                        const cutoff = now - 45000;
                        while (recordedChunks.length > 0 && recordedChunks[0].timestamp < cutoff) {
                            recordedChunks.shift();
                        }
                    }
                };
                mediaRecorder.start(1000);
            } catch (e) {
                console.error("Erro MediaRecorder:", e);
            }
        }

        async function triggerLocalClip(e) {
            if (e) e.stopPropagation();
            const btn = document.getElementById('btnTriggerLocal');
            const btnIcon = document.getElementById('btnIconLocal');
            const btnText = document.getElementById('btnTextLocal');
            const msg = document.getElementById('statusMsgLocal');

            if (!isCamActive || recordedChunks.length === 0 || isProcessingClip) return;

            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            isProcessingClip = true;
            btn.classList.add('active');

            const clickTime = Date.now();
            const startTime = clickTime - (segAntes * 1000);

            msg.textContent = `Aguardando ${segDepois}s posteriores... ⏱️`;
            msg.style.color = "#ff9800";
            msg.classList.add('show');

            await new Promise(r => setTimeout(r, segDepois * 1000));

            const endTime = Date.now();

            btn.classList.remove('active');
            btn.classList.add('fired');
            btnIcon.textContent = '🎬';
            btnText.textContent = 'RECORTADO!';

            screenFlash.classList.add('flash');
            setTimeout(() => screenFlash.classList.remove('flash'), 300);

            const chunksFiltrados = recordedChunks.filter(c => c.timestamp >= startTime && c.timestamp <= endTime);

            const finalBlobs = [];
            if (initHeaderChunk) {
                finalBlobs.push(initHeaderChunk);
            }
            chunksFiltrados.forEach(c => {
                if (c.data !== initHeaderChunk) {
                    finalBlobs.push(c.data);
                }
            });

            const mime = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : 'video/mp4';
            const blob = new Blob(finalBlobs, { type: mime });
            const timeStamp = new Date().toISOString().replace(/[:.-]/g, "_").substring(0, 15);
            const fileName = `REPLAY_${timeStamp}.mp4`;

            saveReplayToDB(blob, fileName);

            const duracaoReal = Math.round((endTime - startTime) / 1000);
            msg.textContent = `Vídeo de ${duracaoReal}s salvo na Galeria! 📼✨`;
            msg.style.color = "#10b981";

            setTimeout(() => {
                btn.classList.remove('fired');
                btnIcon.textContent = '⚡';
                btnText.textContent = 'CORTAR REPLAY';
                isProcessingClip = false;
                setTimeout(() => msg.classList.remove('show'), 2500);
            }, 1500);
        }

        function updateBadges() {

            mappingTarget = null;
            updateBadges();
        }

        function connectStream(camNum) {
            const ipInput = camNum === 1 ? inputIp1 : inputIp2;
            const img = document.getElementById(`mjpegStream${camNum}`);
            const overlay = document.getElementById(`streamOverlay${camNum}`);
            const overlayText = document.getElementById(`overlayText${camNum}`);

            if (!ipInput) return;
            const ip = ipInput.value.trim();
            if (!ip) return;
            localStorage.setItem(`remote_ip_${camNum}`, ip);

            overlayText.textContent = `Conectando Câmera ${camNum}...`;
            overlay.style.display = "flex";

            img.src = `http://${ip}:8080/stream?t=${Date.now()}`;
        }

        function onStreamLoad(camNum) {
            document.getElementById(`streamOverlay${camNum}`).style.display = "none";
        }

        function onStreamError(camNum) {
            document.getElementById(`streamOverlay${camNum}`).style.display = "flex";
            document.getElementById(`overlayText${camNum}`).textContent = `Câmera ${camNum} Offline ou IP Incorreto`;
        }

        async function postCommand(key) {
            if (!key) return false;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/replay_commands`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ license_key: key, command: 'TRIGGER_CLIP' })
                });
                return response.ok;
            } catch (_) {
                return false;
            }
        }

        async function triggerByTarget(target) {
            if (target === "local") {
                triggerLocalClip();
            } else if (target === "1") {
                sendClipCommand(1);
            } else if (target === "2") {
                sendClipCommand(2);
            } else if (target === "both") {
                sendMasterCommand();
            }
        }

        async function sendClipCommand(camNum) {
            const btn = document.getElementById(`btnTrigger${camNum}`);
            const keyInput = camNum === 1 ? inputKey1 : inputKey2;
            const key = keyInput.value.trim();

            if (!key) {
                alert(`Por favor, digite a chave da Licença da Câmera ${camNum}!`);
                keyInput.focus();
                return;
            }

            if (navigator.vibrate) navigator.vibrate(80);

            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 150);

            const ok = await postCommand(key);
            showStatus(camNum, ok ? `Câmera ${camNum} Cortada! 🚀` : "Erro ao enviar", ok ? "#10b981" : "#ff2a2a");
        }

        async function sendMasterCommand() {
            const btn = document.getElementById('btnMaster');
            const key1 = inputKey1.value.trim();
            const key2 = inputKey2.value.trim();

            if (!key1 && !key2) {
                alert("Digite a chave de ao menos uma câmera!");
                return;
            }

            if (navigator.vibrate) navigator.vibrate([80, 50, 80]);

            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 150);

            const res1 = key1 ? postCommand(key1) : Promise.resolve(false);
            const res2 = key2 ? postCommand(key2) : Promise.resolve(false);

            const [ok1, ok2] = await Promise.all([res1, res2]);

            if (key1) showStatus(1, ok1 ? "Câmera 1 Cortada! 🚀" : "Erro", ok1 ? "#10b981" : "#ff2a2a");
            if (key2) showStatus(2, ok2 ? "Câmera 2 Cortada! 🚀" : "Erro", ok2 ? "#10b981" : "#ff2a2a");
        }

        function showStatus(camNum, text, color) {
            const msg = document.getElementById(`statusMsg${camNum}`);
            msg.textContent = text;
            msg.style.color = color;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        /* --- MAPEAMENTO E ESCUTA DE TECLAS DO TECLADO / TECLADO ARCADE --- */
        document.addEventListener('keydown', (event) => {
            // Verifica se a tela ainda está bloqueada
            if (document.getElementById('lockScreen')) return;
            if ([inputKey1, inputKey2, inputIp1, inputIp2].includes(document.activeElement)) return;

            const code = event.code || event.key;

            if (mappingTarget !== null) {
                event.preventDefault();
                finishMapping('keyboard', code, `Tecla: ${code}`);
                return;
            }

            if (arcadeMap1.type === 'keyboard' && (code === arcadeMap1.value || (arcadeMap1.value === 'Space' && event.key === ' '))) {
                event.preventDefault();
                triggerByTarget(btnTarget1.value);
            } else if (arcadeMap2.type === 'keyboard' && (code === arcadeMap2.value || (arcadeMap2.value === 'Space' && event.key === ' '))) {
                event.preventDefault();
                triggerByTarget(btnTarget2.value);
            }
        });

        /* --- MAPEAMENTO E ESCUTA DAS PLACAS DE ARCADE USB (GAMEPAD HID API) --- */
        window.addEventListener("gamepadconnected", (e) => {
            if (gamepadStatus) {
                gamepadStatus.textContent = `🕹️ Placa Arcade USB Conectada (${e.gamepad.id.substring(0, 20)}...)`;
                gamepadStatus.style.color = "#10b981";
                gamepadStatus.style.background = "rgba(16, 185, 129, 0.15)";
            }
        });

        window.addEventListener("gamepaddisconnected", () => {
            if (gamepadStatus) {
                gamepadStatus.textContent = "Aguardando Conexão USB/Bluetooth...";
                gamepadStatus.style.color = "#ff9800";
                gamepadStatus.style.background = "rgba(255, 152, 0, 0.15)";
            }
        });

        let lastGamepadBtnState = {};

        function pollGamepad() {
            // Se o app não foi inicializado ainda, pula
            if (!gamepadStatus) {
                requestAnimationFrame(pollGamepad);
                return;
            }
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (let gIndex = 0; gIndex < gamepads.length; gIndex++) {
                const gp = gamepads[gIndex];
                if (gp && gp.buttons) {
                    for (let bIndex = 0; bIndex < gp.buttons.length; bIndex++) {
                        const isPressed = gp.buttons[bIndex].pressed;
                        const keyState = `g${gIndex}_b${bIndex}`;

                        if (isPressed && !lastGamepadBtnState[keyState]) {
                            lastGamepadBtnState[keyState] = true;

                            if (mappingTarget !== null) {
                                finishMapping('gamepad', bIndex, `Botão Arcade USB #${bIndex + 1}`);
                                break;
                            }

                            if (arcadeMap1.type === 'gamepad' && arcadeMap1.value === bIndex) {
                                triggerByTarget(btnTarget1.value);
                            } else if (arcadeMap2.type === 'gamepad' && arcadeMap2.value === bIndex) {
                                triggerByTarget(btnTarget2.value);
                            }

                        } else if (!isPressed) {
                            lastGamepadBtnState[keyState] = false;
                        }
                    }
                }
            }
            requestAnimationFrame(pollGamepad);
        }
    </script>
</body>
</html>
