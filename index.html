<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meus Recortes - Câmera & Galeria Pro 🎬</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #080a10;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .lock-screen-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0d111d 0%, #080a10 100%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lock-box {
            width: 100%;
            max-width: 420px;
            background: rgba(18, 22, 36, 0.6);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .lock-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ff2a2a 0%, #ff7a00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lock-subtitle {
            font-size: 13px;
            color: #a0a5c0;
            line-height: 1.5;
        }

        .lock-input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .lock-input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            text-align: center;
            letter-spacing: 1.5px;
            transition: border-color 0.25s ease;
        }

        .lock-input-group input:focus {
            border-color: #ff2a2a;
        }

        .btn-validate-license {
            width: 100%;
            background: linear-gradient(135deg, #ff2a2a 0%, #b30000 100%);
            border: none;
            border-radius: 14px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 42, 42, 0.4);
            transition: transform 0.15s ease;
        }

        .btn-validate-license:active {
            transform: scale(0.97);
        }

        .lock-error-msg {
            font-size: 12px;
            font-weight: 700;
            color: #ff4444;
            min-height: 18px;
        }

        /* ESTILOS DO APP (SÓ ENTRAM EM AÇÃO APÓS DESBLOQUEADO) */
        .mode-tabs {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            gap: 8px;
            width: 94%;
            max-width: 520px;
            background: rgba(13, 16, 26, 0.75);
            backdrop-filter: blur(20px);
            padding: 6px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .mode-tabs.hidden-ui {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -20px);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 4px;
            border-radius: 14px;
            border: 1px solid transparent;
            background: transparent;
            color: #8f96b3;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff2a2a 0%, #b30000 100%);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(255, 42, 42, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .fullscreen-cam-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        video#webCamPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .toggle-ui-btn {
            position: fixed;
            top: 66px;
            right: 16px;
            z-index: 60;
            background: rgba(13, 16, 26, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }

        .cam-time-config {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: rgba(13, 16, 26, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .cam-time-config.hidden-ui {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -20px);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .time-box label {
            font-size: 9px;
            font-weight: 800;
            color: #a0a5c0;
            text-transform: uppercase;
        }

        .time-box select {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            outline: none;
        }

        .cam-overlay-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 90%;
            max-width: 380px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .btn-cam-control.hidden-ui {
            display: none !important;
        }

        .btn-cam-control {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: #fff;
            padding: 10px 22px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
            backdrop-filter: blur(10px);
        }

        .btn-trigger-fullscreen {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.35);
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000 70%);
            box-shadow: 
                0 0 40px rgba(255, 42, 42, 0.6),
                inset 0 4px 15px rgba(255, 255, 255, 0.6),
                inset 0 -6px 20px rgba(0, 0, 0, 0.7);
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            outline: none;
            position: relative;
            transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.12s ease;
        }

        .pulse-ring-modern {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(255, 77, 77, 0.6);
            animation: ringPulse 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            pointer-events: none;
        }

        @keyframes ringPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.25); opacity: 0; }
        }

        .btn-trigger-fullscreen.fired {
            animation: fireShockwave 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: radial-gradient(circle at 30% 30%, #10b981, #047857 70%) !important;
            box-shadow: 0 0 60px rgba(16, 185, 129, 0.9), inset 0 4px 15px rgba(255, 255, 255, 0.8) !important;
            border-color: #10b981 !important;
        }

        @keyframes fireShockwave {
            0% { transform: scale(0.85); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .screen-flash-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 185, 129, 0.35);
            backdrop-filter: blur(4px);
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .screen-flash-overlay.flash {
            opacity: 1;
        }

        .status-msg {
            font-size: 13px;
            font-weight: 800;
            color: #10b981;
            background: rgba(8, 10, 16, 0.92);
            padding: 8px 18px;
            border-radius: 20px;
            min-height: 20px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(14px);
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .status-msg.show { opacity: 1; }

        .gallery-container {
            width: 100%;
            max-width: 900px;
            margin-top: 80px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .gallery-title {
            font-size: 16px;
            font-weight: 900;
            color: #ff9800;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .replays-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .replay-card {
            background: rgba(18, 22, 36, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .replay-card video {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            background: #000;
            object-fit: cover;
        }

        .replay-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #a0a5c0;
        }

        .replay-actions { display: flex; gap: 8px; }

        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: none;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-download { background: #10b981; color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-delete { background: rgba(255, 42, 42, 0.15); border: 1px solid #ff2a2a; color: #ff2a2a; }

        .remote-mode-container {
            width: 100%;
            max-width: 900px;
            margin-top: 80px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            max-height: calc(100vh - 90px);
        }

        .arcade-config-panel {
            width: 100%;
            background: rgba(18, 22, 36, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-size: 12px;
            font-weight: 900;
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-transform: uppercase;
        }

        .gamepad-status {
            font-size: 11px;
            font-weight: 700;
            color: #ff9800;
            background: rgba(255, 152, 0, 0.15);
            padding: 2px 8px;
            border-radius: 8px;
        }

        .arcade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }

        .arcade-row {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .arcade-info { display: flex; flex-direction: column; gap: 2px; }
        .arcade-name { font-size: 13px; font-weight: 800; }
        .arcade-key-badge { font-size: 11px; color: #10b981; font-weight: 700; }
        .arcade-controls { display: flex; gap: 6px; align-items: center; }

        .btn-map {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-map:active, .btn-map.recording { background: #10b981; color: #000; }

        .master-bar { width: 100%; margin-bottom: 16px; }

        .btn-master {
            width: 100%;
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            border: none;
            border-radius: 18px;
            padding: 16px;
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 152, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-master:active, .btn-master.active { transform: scale(0.97); }

        .cameras-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .camera-card {
            background: rgba(18, 22, 36, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card-header { width: 100%; display: flex; align-items: center; justify-content: space-between; }
        .camera-title { font-size: 13px; font-weight: 900; letter-spacing: 1px; }
        .title-cam1 { color: #ff2a2a; }
        .title-cam2 { color: #2196F3; }

        .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; color: #10b981; }
        .dot { width: 6px; height: 6px; background-color: #10b981; border-radius: 50%; box-shadow: 0 0 6px #10b981; }

        .video-viewport {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .video-viewport img { width: 100%; height: 100%; object-fit: cover; }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 10, 16, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            color: #a0a5c0;
        }

        .input-group { width: 100%; display: flex; flex-direction: column; gap: 4px; }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            text-align: center;
        }

        .ip-row { display: flex; gap: 6px; }
        .btn-connect {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 0 14px;
            cursor: pointer;
        }

        .btn-trigger-remote {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            outline: none;
            margin-top: 6px;
        }

        .btn-cam1 { background: linear-gradient(135deg, #ff2a2a 0%, #cc0000 100%); box-shadow: 0 0 30px rgba(255, 42, 42, 0.4); }
        .btn-cam2 { background: linear-gradient(135deg, #2196F3 0%, #1565C0 100%); box-shadow: 0 0 30px rgba(33, 150, 243, 0.4); }
        .btn-trigger-remote:active, .btn-trigger-remote.active { transform: scale(0.92); }

        /* --- ESTILOS DO PLACAR AO VIVO (REDESIGN MINIMALISTA) --- */
        .scoreboard-section-container {
            width: 94%;
            max-width: 520px; /* Largura focada para smartphone vertical */
            margin: 86px auto 30px auto;
            background: rgba(18, 22, 28, 0.7);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            padding: 24px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            font-family: 'Roboto', sans-serif;
        }

        /* Sub-Header de Navegação de Pelada */
        .pelada-nav-tabs {
            display: flex;
            width: 100%;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .pelada-nav-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 6px 4px;
            transition: all 0.2s ease;
            position: relative;
        }

        .pelada-nav-btn.active {
            color: #22c55e; /* Verde neon limão sofisticado */
        }

        .pelada-nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #22c55e;
            border-radius: 2px;
        }

        /* Módulo Central: Status AO VIVO e Placar */
        .match-status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .live-tag {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.15);
            color: #22c55e;
            font-size: 9px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 12px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .live-tag-dot {
            width: 6px;
            height: 6px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 6px #22c55e;
            animation: pulseGreen 1.6s infinite;
        }

        @keyframes pulseGreen {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 10px #22c55e; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        /* Cronômetro Esportivo Fino */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-top: 5px;
            width: 100%;
        }

        .timer-display {
            font-size: 38px;
            font-weight: 300; /* Fino */
            letter-spacing: 1.5px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .timer-display:hover {
            color: #22c55e;
        }

        .timer-status-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #8b949e;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .timer-control-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-timer-ctrl {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            color: #d1d5db;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-timer-ctrl:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        /* Placar Principal e Cards */
        .scoreboard-main-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .score-row-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 16px 20px;
        }

        .score-team-lbl {
            font-size: 14px;
            font-weight: 800;
            color: #8b949e;
            text-transform: uppercase;
        }

        .score-team-lbl.lbl-left { color: #3b82f6; }
        .score-team-lbl.lbl-right { color: #eab308; }

        .score-box-modern {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .score-digit-btn {
            font-size: 48px;
            font-weight: 900;
            color: #ffffff;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.1s ease;
            font-variant-numeric: tabular-nums;
        }

        .score-digit-btn:active {
            transform: scale(0.92);
        }

        .score-adjuster-arrows {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .arrow-adjust-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 10px;
            cursor: pointer;
            padding: 2px 6px;
            transition: color 0.15s ease;
        }

        .arrow-adjust-btn:hover {
            color: #ffffff;
        }

        .ball-middle-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ball-middle-icon:hover {
            transform: rotate(180deg) scale(1.1);
        }

        /* Cards de Times Minimalistas */
        .teams-comparison-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
        }

        .team-minimal-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: background 0.2s ease;
        }

        .team-minimal-card:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .team-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .team-card-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .team-left .team-card-title { color: #3b82f6; }
        .team-right .team-card-title { color: #eab308; }

        .players-vertical-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 140px;
        }

        /* Jogadores com Avatares Redondos */
        .player-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 12px;
            transition: all 0.2s ease;
            position: relative;
        }

        .player-row:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .player-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #21262d;
        }

        .team-left .player-avatar {
            border: 1.5px solid #3b82f6;
            box-shadow: 0 0 6px rgba(59, 130, 246, 0.2);
        }

        .team-right .player-avatar {
            border: 1.5px solid #eab308;
            box-shadow: 0 0 6px rgba(234, 179, 8, 0.2);
        }

        .player-name-text {
            font-size: 12px;
            font-weight: 600;
            color: #c9d1d9;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-remove-player {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 11px;
            cursor: pointer;
            opacity: 0;
            padding: 2px 4px;
            transition: opacity 0.15s ease;
        }

        .player-row:hover .btn-remove-player {
            opacity: 0.8;
        }

        /* Fila de Espera */
        .queue-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .queue-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .queue-title {
            font-size: 11px;
            font-weight: 800;
            color: #8b949e;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .queue-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .queue-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            font-size: 12px;
        }

        .queue-team-info {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 80%;
        }

        .queue-team-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-red { background-color: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); }
        .dot-green { background-color: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.4); }
        .dot-blue { background-color: #3b82f6; box-shadow: 0 0 6px rgba(59, 130, 246, 0.4); }
        .dot-yellow { background-color: #eab308; box-shadow: 0 0 6px rgba(234, 179, 8, 0.4); }

        .queue-team-name {
            font-weight: 700;
            color: #c9d1d9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .queue-badge-next {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            font-size: 8px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-queue-action {
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 6px;
            transition: color 0.15s ease;
        }

        .btn-queue-action:hover {
            color: #22c55e;
        }

        /* Rodapé de Regras e Reset */
        .rules-footer {
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .rule-text {
            font-size: 9px;
            font-weight: 900;
            color: #8b949e;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-reset-match-discreet {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 8px;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }

        .btn-reset-match-discreet:hover {
            opacity: 1;
        }

        /* Mobile Viewport Fix */
        @media (max-width: 540px) {
            .scoreboard-section-container {
                width: 96%;
                margin: 76px auto 20px auto;
                padding: 16px 12px;
            }

            .teams-comparison-cards {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .score-digit-btn {
                font-size: 42px;
            }

            .timer-display {
                font-size: 32px;
            }
            
            .btn-remove-player {
                opacity: 0.6;
            }
        }
    </style>
</head>
<body>

    <!-- OVERLAY DE BLOQUEIO DE LICENÇA (Sempre Presente Inicialmente) -->
    <div id="lockScreen" class="lock-screen-container">
        <div class="lock-box" id="lockBoxMain">
            <div class="lock-logo">Meus Recortes 🎬</div>
            <p class="lock-subtitle">Insira uma chave de licença ativa para acessar o sistema web de gravação e controle</p>
            <div class="lock-input-group">
                <input type="text" id="webLicenseInput" placeholder="DIGITE SUA LICENÇA...">
                <button class="btn-validate-license" id="btnValidate" onclick="validateWebLicense()">VALIDAR ACESSO</button>
            </div>
            <div id="lockErrorMsg" class="lock-error-msg"></div>
            <div style="margin-top: 15px; font-size: 11px; color: #a0a5c0; cursor: pointer; text-decoration: underline;" onclick="toggleLockScreenRecovery(true)">Esqueceu sua chave? Recupere pelo e-mail</div>
        </div>

        <!-- Formulário de Recuperação na Tela de Bloqueio -->
        <div class="lock-box" id="lockBoxRecovery" style="display: none;">
            <div class="lock-logo">Recuperar Chave 🔑</div>
            <p class="lock-subtitle">Digite seu e-mail cadastrado para recuperar sua licença ativa.</p>
            <div class="lock-input-group" style="flex-direction: column; gap: 10px; width: 100%;">
                <input type="email" id="webRecoveryEmailInput" placeholder="DIGITE SEU E-MAIL..." style="width: 100%; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); color: #fff; text-align: center; font-size: 13px; font-weight: 600; outline: none;">
                <button class="btn-validate-license" id="btnWebRecover" onclick="recoverWebLicenseKey()" style="width: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: none; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);">RECUPERAR CHAVE</button>
            </div>
            <div id="lockRecoveryErrorMsg" class="lock-error-msg" style="font-size: 12px; font-weight: 600; margin-top: 10px;"></div>
            <div style="margin-top: 15px; font-size: 11px; color: #a0a5c0; cursor: pointer; text-decoration: underline;" onclick="toggleLockScreenRecovery(false)">Voltar para tela de acesso</div>
        </div>
    </div>

    <!-- TEMPLATE DO APLICATIVO PRINCIPAL (Proteção Física contra Burla Visual F12) -->
    <template id="appTemplate">
        <div class="screen-flash-overlay" id="screenFlash"></div>

        <button class="toggle-ui-btn" id="btnToggleUI" onclick="toggleUIAndFullscreen()" title="Ocultar/Exibir Controles">👁️</button>

        <div class="mode-tabs" id="modeTabs">
            <button class="tab-btn active" id="tabLocal" onclick="switchTab('local')">📱 CÂMERA FULLSCREEN</button>
            <button class="tab-btn" id="tabGallery" onclick="switchTab('gallery')">📼 REPLAYS SALVOS</button>
            <button class="tab-btn" id="tabRemote" onclick="switchTab('remote')">📡 REMOTO (2 CÂMS)</button>
            <button class="tab-btn" id="tabScoreboard" onclick="switchTab('scoreboard')">⚽ ACOMPANHAMENTO</button>
        </div>

        <div id="sectionLocal" class="fullscreen-cam-container" onclick="handleViewportClick(event)">
            <video id="webCamPreview" autoplay playsinline muted></video>

            <div class="cam-time-config" id="camTimeConfig">
                <div class="time-box">
                    <label>⏱️ ANTES DO CLIQUE</label>
                    <select id="timeAntes" onchange="updateTimeConfig()">
                        <option value="5">5 Segundos</option>
                        <option value="10" selected>10 Segundos</option>
                        <option value="15">15 Segundos</option>
                        <option value="20">20 Segundos</option>
                        <option value="30">30 Segundos</option>
                    </select>
                </div>
                <div class="time-box">
                    <label>⏱️ DEPOIS DO CLIQUE</label>
                    <select id="timeDepois" onchange="updateTimeConfig()">
                        <option value="3">3 Segundos</option>
                        <option value="5" selected>5 Segundos</option>
                        <option value="10">10 Segundos</option>
                        <option value="15">15 Segundos</option>
                    </select>
                </div>
            </div>

            <div class="cam-overlay-controls" id="camOverlayControls">
                <button class="btn-cam-control" id="btnToggleCam" onclick="toggleWebCam(event)">📷 LIGAR CÂMERA DO CELULAR</button>

                <button class="btn-trigger-fullscreen" id="btnTriggerLocal" onclick="triggerLocalClip(event)">
                    <div class="pulse-ring-modern"></div>
                    <div style="font-size: 34px;" id="btnIconLocal">⚡</div>
                    <div style="font-size: 14px; font-weight: 900; letter-spacing: 1px;" id="btnTextLocal">CORTAR REPLAY</div>
                    <div style="font-size: 9px; opacity: 0.8;" id="clipInfoText">10s Antes / 5s Depois</div>
                </button>

                <div class="status-msg" id="statusMsgLocal"></div>
            </div>
        </div>

        <div id="sectionGallery" class="gallery-container" style="display: none;">
            <div class="gallery-title">
                <span>📼 Galeria de Replays Salvos no Celular</span>
                <button class="btn-action btn-delete" onclick="clearAllReplays()" style="width: auto; padding: 4px 10px;">🗑️ Limpar Todos</button>
            </div>

            <div class="replays-list" id="replaysList">
                <div style="text-align: center; color: #a0a5c0; grid-column: 1/-1; padding: 40px;">Nenhum replay salvo ainda. Ligue a câmera e corte o primeiro lance!</div>
            </div>
        </div>

        <div id="sectionRemote" class="remote-mode-container" style="display: none;">
            <div class="arcade-config-panel">
                <div class="panel-title">
                    <span>🕹️ Configuração dos Botões Físicos de Arcade</span>
                    <span class="gamepad-status" id="gamepadStatus">Aguardando Conexão USB/Bluetooth...</span>
                </div>
                
                <div class="arcade-grid">
                    <div class="arcade-row">
                        <div class="arcade-info">
                            <div class="arcade-name">Botão Arcade 1</div>
                            <div class="arcade-key-badge" id="btnKeyBadge1">Mapeado: Tecla Espaço / Botão #0</div>
                        </div>
                        <div class="arcade-controls">
                            <select id="btnTarget1" onchange="saveArcadeMapping()">
                                <option value="local">Câmera deste Celular (MP4)</option>
                                <option value="1">Câmera 1 (Lado A)</option>
                                <option value="2">Câmera 2 (Lado B)</option>
                                <option value="both">Ambas as Remotas</option>
                            </select>
                            <button class="btn-map" id="btnMap1" onclick="startMapping(1)">🎯 Mapear</button>
                        </div>
                    </div>

                    <div class="arcade-row">
                        <div class="arcade-info">
                            <div class="arcade-name">Botão Arcade 2</div>
                            <div class="arcade-key-badge" id="btnKeyBadge2">Mapeado: Tecla Enter / Botão #1</div>
                        </div>
                        <div class="arcade-controls">
                            <select id="btnTarget2" onchange="saveArcadeMapping()">
                                <option value="local">Câmera deste Celular (MP4)</option>
                                <option value="1">Câmera 1 (Lado A)</option>
                                <option value="2" selected>Câmera 2 (Lado B)</option>
                                <option value="both">Ambas as Remotas</option>
                            </select>
                            <button class="btn-map" id="btnMap2" onclick="startMapping(2)">🎯 Mapear</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="master-bar">
                <button class="btn-master" id="btnMaster" onclick="sendMasterCommand()">
                    <span>⚡ CORTAR AS 2 CÂMERAS AO MESMO TEMPO</span>
                </button>
            </div>

            <div class="cameras-grid">
                <div class="camera-card">
                    <div class="card-header">
                        <div class="camera-title title-cam1">🎥 CÂMERA 1</div>
                        <div class="live-indicator"><div class="dot"></div><span>ONLINE</span></div>
                    </div>

                    <div class="video-viewport">
                        <img id="mjpegStream1" src="" alt="" onerror="onStreamError(1)" onload="onStreamLoad(1)">
                        <div class="video-overlay" id="streamOverlay1"><span id="overlayText1">Digite o IP da Câmera 1</span></div>
                    </div>

                    <div class="input-group">
                        <label>IP da Câmera 1 (Wi-Fi)</label>
                        <div class="ip-row">
                            <input type="text" id="cameraIp1" placeholder="Ex: 192.168.1.50">
                            <button class="btn-connect" onclick="connectStream(1)">CONECTAR</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Chave da Licença 1</label>
                        <input type="text" id="licenseKey1" placeholder="Licença Câmera 1...">
                    </div>

                    <button class="btn-trigger-remote btn-cam1" id="btnTrigger1" onclick="sendClipCommand(1)">
                        <div style="font-size: 28px;">⚡</div>
                        <div style="font-size: 12px; font-weight: 900;">CORTAR CÂM 1</div>
                    </button>

                    <div class="status-msg" id="statusMsg1"></div>
                </div>

                <div class="camera-card">
                    <div class="card-header">
                        <div class="camera-title title-cam2">🎥 CÂMERA 2</div>
                        <div class="live-indicator"><div class="dot"></div><span>ONLINE</span></div>
                    </div>

                    <div class="video-viewport">
                        <img id="mjpegStream2" src="" alt="" onerror="onStreamError(2)" onload="onStreamLoad(2)">
                        <div class="video-overlay" id="streamOverlay2"><span id="overlayText2">Digite o IP da Câmera 2</span></div>
                    </div>

                    <div class="input-group">
                        <label>IP da Câmera 2 (Wi-Fi)</label>
                        <div class="ip-row">
                            <input type="text" id="cameraIp2" placeholder="Ex: 192.168.1.60">
                            <button class="btn-connect" onclick="connectStream(2)">CONECTAR</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Chave da Licença 2</label>
                        <input type="text" id="licenseKey2" placeholder="Licença Câmera 2...">
                    </div>

                    <button class="btn-trigger-remote btn-cam2" id="btnTrigger2" onclick="sendClipCommand(2)">
                        <div style="font-size: 28px;">⚡</div>
                        <div style="font-size: 12px; font-weight: 900;">CORTAR CÂM 2</div>
                    </button>

                    <div class="status-msg" id="statusMsg2"></div>
                </div>
            </div>

            <!-- SEÇÃO PLACAR AO VIVO (REDESIGN ACOMPANHAMENTO MOBILE) -->
            <div id="sectionScoreboard" class="scoreboard-section-container" style="display: none;">
                <!-- Sub-Header de Navegação de Pelada -->
                <div class="pelada-nav-tabs">
                    <button class="pelada-nav-btn">DASHBOARD</button>
                    <button class="pelada-nav-btn">CONVOCAÇÃO</button>
                    <button class="pelada-nav-btn active">ACOMPANHAMENTO</button>
                    <button class="pelada-nav-btn">RANKING</button>
                    <button class="pelada-nav-btn">DESEMPENHO</button>
                </div>

                <!-- Módulo Central: Status AO VIVO -->
                <div class="match-status-row">
                    <div class="live-tag">
                        <span class="live-tag-dot" id="timerPulseDot" style="display: none;"></span>
                        <span>AO VIVO</span>
                    </div>
                </div>

                <!-- Timer e Controles do Cronômetro -->
                <div class="timer-container">
                    <div class="timer-display" id="timerVal" onclick="toggleTimer()">00:00 / 15:00</div>
                    <div class="timer-status-row">
                        <span id="timerStatusText">Aguardando início</span>
                    </div>
                    <div class="timer-control-buttons">
                        <button class="btn-timer-ctrl" onclick="startTimer()">INICIAR</button>
                        <button class="btn-timer-ctrl" onclick="pauseTimer()">PAUSAR</button>
                        <button class="btn-timer-ctrl" onclick="resetTimer()">ZERAR</button>
                    </div>
                </div>

                <!-- Placar Central Dominante -->
                <div class="score-row-display">
                    <span class="score-team-lbl lbl-left" id="lblTeamLeft">AZUL</span>
                    <div class="score-box-modern">
                        <button class="score-digit-btn" onclick="adjustScore('left', 1)" title="Adicionar gol" id="scoreLeftBtn">0</button>
                        <span class="score-val" id="scoreLeft" style="display:none;">0</span>
                        <div class="score-adjuster-arrows">
                            <button class="arrow-adjust-btn" onclick="adjustScore('left', 1)">▲</button>
                            <button class="arrow-adjust-btn" onclick="adjustScore('left', -1)">▼</button>
                        </div>
                    </div>

                    <!-- Ícone de Bola de Futebol Centralizado -->
                    <div class="ball-middle-icon" id="ballIcon" onclick="adjustScore('left', 1)" title="Gol do Time Azul!">
                        <svg class="soccer-ball" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                            <path fill="#ffffff" d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm0 48c31.1 0 60.5 7.1 87 19.8l-37 37-50-50v-6.8zm-76 6.8v6.8l-50 50-37-37c26.5-12.7 55.9-19.8 87-19.8zm-119 79l37 37-19.8 87H72c0-31.1 7.1-60.5 19.8-87zm-19.8 135h6.8l87 19.8-37 37c-12.7-26.5-19.8-55.9-19.8-87zm50 126l37-37 50 50v-6.8c-31.1 0-60.5-7.1-87-19.8zm119-6.8v6.8c31.1 0 60.5-7.1 87-19.8l-37-37-50 50zm166-79l-37-37 19.8-87h6.8c0 31.1-7.1 60.5-19.8 87zm19.8-135h-6.8l-87-19.8 37-37c12.7 26.5 19.8 55.9 19.8 87zM256 160c53 0 96 43 96 96s-43 96-96 96-96-43-96-96 96-96 96-96z"/>
                        </svg>
                    </div>

                    <div class="score-box-modern">
                        <button class="score-digit-btn" onclick="adjustScore('right', 1)" title="Adicionar gol" id="scoreRightBtn">0</button>
                        <span class="score-val" id="scoreRight" style="display:none;">0</span>
                        <div class="score-adjuster-arrows">
                            <button class="arrow-adjust-btn" onclick="adjustScore('right', 1)">▲</button>
                            <button class="arrow-adjust-btn" onclick="adjustScore('right', -1)">▼</button>
                        </div>
                    </div>
                    <span class="score-team-lbl lbl-right" id="lblTeamRight">AMARELO</span>
                </div>

                <!-- Cards dos Times Lado a Lado -->
                <div class="teams-comparison-cards">
                    <!-- Time Esquerdo (Azul) -->
                    <div class="team-minimal-card team-left" id="cardTeamLeft">
                        <div class="team-card-header" onclick="editTeamName('left')">
                            <span class="team-card-title" id="nameTeamLeft">Time Azul</span>
                            <span class="edit-icon" style="font-size:10px; opacity:0.5;">✏️</span>
                        </div>
                        <div class="players-vertical-list" id="listTeamLeft">
                            <!-- Jogadores com avatares serão carregados aqui -->
                        </div>
                        <div class="add-player-row">
                            <input type="text" id="inputAddPlayerLeft" placeholder="Novo jogador..." onkeydown="if(event.key === 'Enter') addPlayer('left')">
                            <button onclick="addPlayer('left')">+</button>
                        </div>
                    </div>

                    <!-- Time Direito (Amarelo) -->
                    <div class="team-minimal-card team-right" id="cardTeamRight">
                        <div class="team-card-header" onclick="editTeamName('right')">
                            <span class="team-card-title" id="nameTeamRight">Time Amarelo</span>
                            <span class="edit-icon" style="font-size:10px; opacity:0.5;">✏️</span>
                        </div>
                        <div class="players-vertical-list" id="listTeamRight">
                            <!-- Jogadores com avatares serão carregados aqui -->
                        </div>
                        <div class="add-player-row">
                            <input type="text" id="inputAddPlayerRight" placeholder="Novo jogador..." onkeydown="if(event.key === 'Enter') addPlayer('right')">
                            <button onclick="addPlayer('right')">+</button>
                        </div>
                    </div>

        async function verifyAndAssociateLicense(key) {
            if (!key) return false;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/licenses?license_key=eq.${encodeURIComponent(key.trim())}&select=*`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (!response.ok) return false;
                const data = await response.json();
                if (!data || data.length === 0) return false;

                const license = data[0];

                if (license.is_active !== true) return false;

                // Validação de expiração para chaves de teste (3 dias desde a ativação)
                if (key.startsWith("TEST-") && license.activated_at) {
                    const activatedDate = new Date(license.activated_at);
                    const now = new Date();
                    const diffTime = Math.abs(now - activatedDate);
                    const diffDays = diffTime / (1000 * 60 * 60 * 24);
                    
                    if (diffDays > 3) {
                        console.warn("Licença de teste expirada. Desativando no Supabase...");
                        await deactivateLicenseOnSupabase(key);
                        return false;
                    }
                }

                // Validação de expiração para chaves oficiais (30 dias desde a primeira ativação)
                if (key.startsWith("MR-") && license.activated_at) {
                    const activatedDate = new Date(license.activated_at);
                    const now = new Date();
                    const diffTime = Math.abs(now - activatedDate);
                    const diffDays = diffTime / (1000 * 60 * 60 * 24);
                    
                    if (diffDays > 30) {
                        console.warn("Licença mensal expirada. Desativando no Supabase...");
                        await deactivateLicenseOnSupabase(key);
                        return false;
                    }
                }

                const dbDeviceId = license.device_id;
                
                if (!dbDeviceId || dbDeviceId === "null" || dbDeviceId === "") {
                    const associateRes = await associateWebDevice(key, webDeviceId);
                    return associateRes;
                }

                if (dbDeviceId !== webDeviceId) {
                    console.warn("Licença em uso por outro aparelho:", dbDeviceId);
                    return false;
                }

                return true;
            } catch (_) {
                return false;
            }
        }

        function initIndexedDB() {

                db = e.target.result;
                if (!db.objectStoreNames.contains("replays")) {
                    db.createObjectStore("replays", { keyPath: "id", autoIncrement: true });

            request.onsuccess = (e) => {
                db = e.target.result;

            const store = transaction.objectStore("replays");
            const replayItem = {
                name: name,
                date: new Date().toLocaleString("pt-BR"),
                blob: blob
            };
            store.add(replayItem);
            transaction.oncomplete = () => {
                loadGalleryReplays();
            };
        }

        function loadGalleryReplays() {
            if (!db) return;
            const replaysList = document.getElementById('replaysList');
            if (!replaysList) return;
            const transaction = db.transaction(["replays"], "readonly");
            const store = transaction.objectStore("replays");
            const getRequest = store.getAll();

            getRequest.onsuccess = () => {
                const items = getRequest.result;
                if (!items || items.length === 0) {
                    replaysList.innerHTML = `<div style="text-align: center; color: #a0a5c0; grid-column: 1/-1; padding: 40px;">Nenhum replay salvo ainda. Ligue a câmera e corte o primeiro lance!</div>`;
                    return;
                }

                replaysList.innerHTML = items.reverse().map(item => {
                    const videoUrl = URL.createObjectURL(item.blob);
                    return `
                        <div class="replay-card">
                            <video src="${videoUrl}" controls playsinline></video>
                            <div class="replay-meta">
                                <span>📅 ${item.date}</span>
                                <span>📹 ${item.name}</span>
                            </div>
                            <div class="replay-actions">
                                <button class="btn-action btn-download" onclick="downloadReplayBlob(${item.id})">💾 Baixar MP4</button>
                                <button class="btn-action btn-delete" onclick="deleteReplayFromDB(${item.id})">🗑️ Apagar</button>
                            </div>
                        </div>
                    `;
                }).join('');
            };
        }

        function downloadReplayBlob(id) {
            const transaction = db.transaction(["replays"], "readonly");
            const store = transaction.objectStore("replays");
            const getReq = store.get(id);
            getReq.onsuccess = () => {
                const item = getReq.result;
                if (!item) return;
                const url = URL.createObjectURL(item.blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = item.name;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 150);
            };
        }

        function deleteReplayFromDB(id) {
            const transaction = db.transaction(["replays"], "readwrite");
            const store = transaction.objectStore("replays");
            store.delete(id);
            transaction.oncomplete = () => loadGalleryReplays();
        }

        function clearAllReplays() {
            if (!confirm("Tem certeza que deseja apagar todos os replays salvos no celular?")) return;
            const transaction = db.transaction(["replays"], "readwrite");
            const store = transaction.objectStore("replays");
            store.clear();
            transaction.oncomplete = () => loadGalleryReplays();
        }

        function toggleUIAndFullscreen() {
            isUiVisible = !isUiVisible;
            const modeTabs = document.getElementById('modeTabs');
            const camTimeConfig = document.getElementById('camTimeConfig');
            const btnToggleCam = document.getElementById('btnToggleCam');
            const btnToggleUI = document.getElementById('btnToggleUI');

            if (!isUiVisible) {
                modeTabs.classList.add('hidden-ui');
                camTimeConfig.classList.add('hidden-ui');
                btnToggleCam.classList.add('hidden-ui');
                btnToggleUI.textContent = '👁️‍🗨️';
                
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            } else {
                modeTabs.classList.remove('hidden-ui');
                camTimeConfig.classList.remove('hidden-ui');
                btnToggleCam.classList.remove('hidden-ui');
                btnToggleUI.textContent = '👁️';

                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function handleViewportClick(e) {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SELECT') {
                toggleUIAndFullscreen();
            }
        }

        function updateTimeConfig() {
            segAntes = parseInt(selectAntes.value);
            segDepois = parseInt(selectDepois.value);
            localStorage.setItem('seg_antes', segAntes);
            localStorage.setItem('seg_depois', segDepois);
            updateTimeText();
        }

        function updateTimeText() {
            if (clipInfoText) {
                clipInfoText.textContent = `${segAntes}s Antes / ${segDepois}s Depois`;
            }
        }

        function switchTab(mode) {
            const tabLocal = document.getElementById('tabLocal');
            const tabGallery = document.getElementById('tabGallery');
            const tabRemote = document.getElementById('tabRemote');
            const tabScoreboard = document.getElementById('tabScoreboard');
            
            const secLocal = document.getElementById('sectionLocal');
            const secGallery = document.getElementById('sectionGallery');
            const secRemote = document.getElementById('sectionRemote');
            const secScoreboard = document.getElementById('sectionScoreboard');

            tabLocal.classList.remove('active');
            tabGallery.classList.remove('active');
            tabRemote.classList.remove('active');
            if (tabScoreboard) tabScoreboard.classList.remove('active');

            secLocal.style.display = 'none';
            secGallery.style.display = 'none';
            secRemote.style.display = 'none';
            if (secScoreboard) secScoreboard.style.display = 'none';

            if (mode === 'local') {
                tabLocal.classList.add('active');
                secLocal.style.display = 'flex';
            } else if (mode === 'gallery') {
                tabGallery.classList.add('active');
                secGallery.style.display = 'flex';
                loadGalleryReplays();
            } else if (mode === 'remote') {
                tabRemote.classList.add('active');
                secRemote.style.display = 'flex';
            } else if (mode === 'scoreboard') {
                if (tabScoreboard) tabScoreboard.classList.add('active');
                if (secScoreboard) secScoreboard.style.display = 'flex';
                renderScoreboard();
            }
        }

        async function toggleWebCam(e) {
            if (e) e.stopPropagation();
            const videoElem = document.getElementById('webCamPreview');
            const btnToggle = document.getElementById('btnToggleCam');

            if (!isCamActive) {
                try {
                    webStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: true
                    });
                    videoElem.srcObject = webStream;
                    isCamActive = true;
                    btnToggle.textContent = "🛑 DESLIGAR CÂMERA";
                    btnToggle.style.background = "#ff2a2a";

                    startBufferRecorder();
                } catch (err) {
                    alert("Erro ao acessar a câmera: " + err.message);
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
                if (webStream) webStream.getTracks().forEach(track => track.stop());
                videoElem.srcObject = null;
                isCamActive = false;
                btnToggle.textContent = "📷 LIGAR CÂMERA DO CELULAR";
                btnToggle.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)";
            }
        }

        function startBufferRecorder() {
            recordedChunks = [];
            initHeaderChunk = null;
            let options = { mimeType: 'video/webm' };
            if (MediaRecorder.isTypeSupported('video/mp4')) options = { mimeType: 'video/mp4' };

            try {
                mediaRecorder = new MediaRecorder(webStream, options);
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        const now = Date.now();
                        if (!initHeaderChunk) {
                            initHeaderChunk = e.data;
                        }
                        recordedChunks.push({
                            data: e.data,
                            timestamp: now
                        });
                        const cutoff = now - 45000;
                        while (recordedChunks.length > 0 && recordedChunks[0].timestamp < cutoff) {
                            recordedChunks.shift();
                        }
                    }
                };
                mediaRecorder.start(1000);
            } catch (e) {
                console.error("Erro MediaRecorder:", e);
            }
        }

        async function triggerLocalClip(e) {
            if (e) e.stopPropagation();
            const btn = document.getElementById('btnTriggerLocal');
            const btnIcon = document.getElementById('btnIconLocal');
            const btnText = document.getElementById('btnTextLocal');
            const msg = document.getElementById('statusMsgLocal');

            if (!isCamActive || recordedChunks.length === 0 || isProcessingClip) return;

            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            isProcessingClip = true;
            btn.classList.add('active');

            const clickTime = Date.now();
            const startTime = clickTime - (segAntes * 1000);

            msg.textContent = `Aguardando ${segDepois}s posteriores... ⏱️`;
            msg.style.color = "#ff9800";
            msg.classList.add('show');

            await new Promise(r => setTimeout(r, segDepois * 1000));

            const endTime = Date.now();

            btn.classList.remove('active');
            btn.classList.add('fired');
            btnIcon.textContent = '🎬';
            btnText.textContent = 'RECORTADO!';

            screenFlash.classList.add('flash');
            setTimeout(() => screenFlash.classList.remove('flash'), 300);

            const chunksFiltrados = recordedChunks.filter(c => c.timestamp >= startTime && c.timestamp <= endTime);

            const finalBlobs = [];
            if (initHeaderChunk) {
                finalBlobs.push(initHeaderChunk);
            }
            chunksFiltrados.forEach(c => {
                if (c.data !== initHeaderChunk) {
                    finalBlobs.push(c.data);
                }
            });

            const mime = (mediaRecorder && mediaRecorder.mimeType) ? mediaRecorder.mimeType : 'video/mp4';
            const blob = new Blob(finalBlobs, { type: mime });
            const timeStamp = new Date().toISOString().replace(/[:.-]/g, "_").substring(0, 15);
            const fileName = `REPLAY_${timeStamp}.mp4`;

            saveReplayToDB(blob, fileName);

            const duracaoReal = Math.round((endTime - startTime) / 1000);
            msg.textContent = `Vídeo de ${duracaoReal}s salvo na Galeria! 📼✨`;
            msg.style.color = "#10b981";

            setTimeout(() => {
                btn.classList.remove('fired');
                btnIcon.textContent = '⚡';
                btnText.textContent = 'CORTAR REPLAY';
                isProcessingClip = false;
                setTimeout(() => msg.classList.remove('show'), 2500);
            }, 1500);
        }

        function updateBadges() {
            if (btnKeyBadge1) btnKeyBadge1.textContent = `Mapeado: ${arcadeMap1.label}`;
            if (btnKeyBadge2) btnKeyBadge2.textContent = `Mapeado: ${arcadeMap2.label}`;
        }

        function saveArcadeMapping() {
            localStorage.setItem('arcade_target_1', btnTarget1.value);
            localStorage.setItem('arcade_target_2', btnTarget2.value);
        }

        function startMapping(btnNum) {
            mappingTarget = btnNum;
            const btnMap = document.getElementById(`btnMap${btnNum}`);
            btnMap.textContent = "Pressione o Botão...";
            btnMap.classList.add('recording');
        }

        function finishMapping(type, value, label) {
            if (mappingTarget === 1) {
                arcadeMap1 = { type, value, label };
                localStorage.setItem('arcade_map_1', JSON.stringify(arcadeMap1));
                document.getElementById('btnMap1').textContent = "🎯 Mapear";
                document.getElementById('btnMap1').classList.remove('recording');
            } else if (mappingTarget === 2) {
                arcadeMap2 = { type, value, label };
                localStorage.setItem('arcade_map_2', JSON.stringify(arcadeMap2));
                document.getElementById('btnMap2').textContent = "🎯 Mapear";
                document.getElementById('btnMap2').classList.remove('recording');
            }
            mappingTarget = null;
            updateBadges();
        }

        function connectStream(camNum) {
            const ipInput = camNum === 1 ? inputIp1 : inputIp2;
            const img = document.getElementById(`mjpegStream${camNum}`);
            const overlay = document.getElementById(`streamOverlay${camNum}`);
            const overlayText = document.getElementById(`overlayText${camNum}`);

            if (!ipInput) return;
            const ip = ipInput.value.trim();
            if (!ip) return;
            localStorage.setItem(`remote_ip_${camNum}`, ip);

            overlayText.textContent = `Conectando Câmera ${camNum}...`;
            overlay.style.display = "flex";

            img.src = `http://${ip}:8080/stream?t=${Date.now()}`;
        }

        function onStreamLoad(camNum) {
            document.getElementById(`streamOverlay${camNum}`).style.display = "none";
        }

        function onStreamError(camNum) {
            document.getElementById(`streamOverlay${camNum}`).style.display = "flex";
            document.getElementById(`overlayText${camNum}`).textContent = `Câmera ${camNum} Offline ou IP Incorreto`;
        }

        async function postCommand(key) {
            if (!key) return false;
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/replay_commands`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({ license_key: key, command: 'TRIGGER_CLIP' })
                });
                return response.ok;
            } catch (_) {
                return false;
            }
        }

        async function triggerByTarget(target) {
            if (target === "local") {
                triggerLocalClip();
            } else if (target === "1") {
                sendClipCommand(1);
            } else if (target === "2") {
                sendClipCommand(2);
            } else if (target === "both") {
                sendMasterCommand();
            }
        }

        async function sendClipCommand(camNum) {
            const btn = document.getElementById(`btnTrigger${camNum}`);
            const keyInput = camNum === 1 ? inputKey1 : inputKey2;
            const key = keyInput.value.trim();

            if (!key) {
                alert(`Por favor, digite a chave da Licença da Câmera ${camNum}!`);
                keyInput.focus();
                return;
            }

            if (navigator.vibrate) navigator.vibrate(80);

            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 150);

            const ok = await postCommand(key);
            showStatus(camNum, ok ? `Câmera ${camNum} Cortada! 🚀` : "Erro ao enviar", ok ? "#10b981" : "#ff2a2a");
        }

        async function sendMasterCommand() {
            const btn = document.getElementById('btnMaster');
            const key1 = inputKey1.value.trim();
            const key2 = inputKey2.value.trim();

            if (!key1 && !key2) {
                alert("Digite a chave de ao menos uma câmera!");
                return;
            }

            if (navigator.vibrate) navigator.vibrate([80, 50, 80]);

            btn.classList.add('active');
            setTimeout(() => btn.classList.remove('active'), 150);

            const res1 = key1 ? postCommand(key1) : Promise.resolve(false);
            const res2 = key2 ? postCommand(key2) : Promise.resolve(false);

            const [ok1, ok2] = await Promise.all([res1, res2]);

            if (key1) showStatus(1, ok1 ? "Câmera 1 Cortada! 🚀" : "Erro", ok1 ? "#10b981" : "#ff2a2a");
            if (key2) showStatus(2, ok2 ? "Câmera 2 Cortada! 🚀" : "Erro", ok2 ? "#10b981" : "#ff2a2a");
        }

        function showStatus(camNum, text, color) {
            const msg = document.getElementById(`statusMsg${camNum}`);
            msg.textContent = text;
            msg.style.color = color;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        /* --- MAPEAMENTO E ESCUTA DE TECLAS DO TECLADO / TECLADO ARCADE --- */
        document.addEventListener('keydown', (event) => {
            // Verifica se a tela ainda está bloqueada
            if (document.getElementById('lockScreen')) return;
            if ([inputKey1, inputKey2, inputIp1, inputIp2].includes(document.activeElement)) return;

            const code = event.code || event.key;

            if (mappingTarget !== null) {
                event.preventDefault();
                finishMapping('keyboard', code, `Tecla: ${code}`);
                return;
            }

            if (arcadeMap1.type === 'keyboard' && (code === arcadeMap1.value || (arcadeMap1.value === 'Space' && event.key === ' '))) {
                event.preventDefault();
                triggerByTarget(btnTarget1.value);
            } else if (arcadeMap2.type === 'keyboard' && (code === arcadeMap2.value || (arcadeMap2.value === 'Space' && event.key === ' '))) {
                event.preventDefault();
                triggerByTarget(btnTarget2.value);
            }
        });

        /* --- MAPEAMENTO E ESCUTA DAS PLACAS DE ARCADE USB (GAMEPAD HID API) --- */
        window.addEventListener("gamepadconnected", (e) => {
            if (gamepadStatus) {
                gamepadStatus.textContent = `🕹️ Placa Arcade USB Conectada (${e.gamepad.id.substring(0, 20)}...)`;
                gamepadStatus.style.color = "#10b981";
                gamepadStatus.style.background = "rgba(16, 185, 129, 0.15)";
            }
        });

        window.addEventListener("gamepaddisconnected", () => {
            if (gamepadStatus) {
                gamepadStatus.textContent = "Aguardando Conexão USB/Bluetooth...";
                gamepadStatus.style.color = "#ff9800";
                gamepadStatus.style.background = "rgba(255, 152, 0, 0.15)";
            }
        });

        let lastGamepadBtnState = {};

        function pollGamepad() {
            // Se o app não foi inicializado ainda, pula
            if (!gamepadStatus) {
                requestAnimationFrame(pollGamepad);
                return;
            }
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            for (let gIndex = 0; gIndex < gamepads.length; gIndex++) {
                const gp = gamepads[gIndex];
                if (gp && gp.buttons) {
                    for (let bIndex = 0; bIndex < gp.buttons.length; bIndex++) {
                        const isPressed = gp.buttons[bIndex].pressed;
                        const keyState = `g${gIndex}_b${bIndex}`;

                        if (isPressed && !lastGamepadBtnState[keyState]) {
                            lastGamepadBtnState[keyState] = true;

                            if (mappingTarget !== null) {
                                finishMapping('gamepad', bIndex, `Botão Arcade USB #${bIndex + 1}`);
                                break;
                            }

                            if (arcadeMap1.type === 'gamepad' && arcadeMap1.value === bIndex) {
                                triggerByTarget(btnTarget1.value);
                            } else if (arcadeMap2.type === 'gamepad' && arcadeMap2.value === bIndex) {
                                triggerByTarget(btnTarget2.value);
                            }

                        } else if (!isPressed) {
                            lastGamepadBtnState[keyState] = false;
                        }
                    }
                }
            }
            requestAnimationFrame(pollGamepad);
        }
    </script>
